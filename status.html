<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0">

<meta
  name="theme-color"
  content="#050816">

<meta
  name="description"
  content="SK KGN TEAM Complaint Tracking System">

<title>
Complaint Tracking — SK KGN TEAM
</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}


:root{

  --bg:#050816;
  --bg2:#091329;

  --blue:#2878ff;
  --blue2:#5b8cff;
  --cyan:#27c8ff;

  --purple:#805cff;

  --green:#20d17a;

  --red:#ff4f61;

  --white:#f8fbff;

  --muted:#8996aa;

  --border:rgba(255,255,255,.11);

}


/* =========================================================
   BODY
========================================================= */

html{
  scroll-behavior:smooth;
}


body{

  font-family:
    Inter,
    Arial,
    sans-serif;

  min-height:100vh;

  color:var(--white);

  background:

    radial-gradient(
      circle at 8% 5%,
      rgba(40,120,255,.17),
      transparent 30%
    ),

    radial-gradient(
      circle at 92% 15%,
      rgba(128,92,255,.13),
      transparent 28%
    ),

    radial-gradient(
      circle at 50% 90%,
      rgba(39,200,255,.07),
      transparent 30%
    ),

    var(--bg);

  overflow-x:hidden;

}


/* =========================================================
   AMBIENT LIGHT
========================================================= */

body:before,
body:after{

  content:"";

  position:fixed;

  width:360px;
  height:360px;

  border-radius:50%;

  filter:blur(110px);

  pointer-events:none;

  z-index:-1;

}


body:before{

  background:rgba(40,120,255,.13);

  left:-190px;

  top:20%;

  animation:
    ambientOne
    11s
    ease-in-out
    infinite;

}


body:after{

  background:rgba(128,92,255,.11);

  right:-190px;

  top:55%;

  animation:
    ambientTwo
    13s
    ease-in-out
    infinite;

}


@keyframes ambientOne{

  50%{
    transform:
      translate(80px,-45px);
  }

}


@keyframes ambientTwo{

  50%{
    transform:
      translate(-70px,55px);
  }

}


/* =========================================================
   MAIN CONTAINER
========================================================= */

.container{

  width:min(850px,94%);

  margin:auto;

}


/* =========================================================
   BRAND
========================================================= */

.top{

  padding:
    24px
    0
    5px;

}


.brand{

  display:flex;

  align-items:center;

  gap:12px;

  color:#fff;

  text-decoration:none;

  font-weight:900;

  font-size:19px;

}


.brand img{

  width:50px;

  height:50px;

  border-radius:16px;

  object-fit:cover;

  background:#fff;

  border:
    1px solid
    rgba(255,255,255,.16);

  box-shadow:

    0 0 0 5px
      rgba(40,120,255,.07),

    0 12px 32px
      rgba(0,0,0,.35);

}


/* =========================================================
   HERO
========================================================= */

.hero{

  padding:
    32px
    0
    35px;

  text-align:center;

}


/* =========================================================
   PREMIUM BADGE
========================================================= */

.badge{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  padding:
    10px
    18px;

  border-radius:50px;

  color:#9bc6ff;

  background:
    rgba(40,120,255,.075);

  border:
    1px solid
    rgba(40,120,255,.23);

  font-size:10px;

  font-weight:900;

  letter-spacing:1.2px;

  box-shadow:

    inset
    0 1px 0
    rgba(255,255,255,.08),

    0 0 35px
    rgba(40,120,255,.08);

  animation:
    badgePulse
    2.8s
    infinite;

}


@keyframes badgePulse{

  50%{

    box-shadow:

      inset
      0 1px 0
      rgba(255,255,255,.08),

      0 0 48px
      rgba(40,120,255,.20);

  }

}


/* =========================================================
   SEARCH FIRST
========================================================= */

.search-shell{

  margin-top:25px;

  padding:1px;

  border-radius:28px;

  background:

    linear-gradient(
      135deg,
      rgba(40,120,255,.60),
      rgba(128,92,255,.20),
      rgba(39,200,255,.36)
    );

  box-shadow:

    0 25px 90px
      rgba(0,0,0,.35),

    0 0 55px
      rgba(40,120,255,.08);

}


.search-card{

  position:relative;

  overflow:hidden;

  padding:25px;

  border-radius:27px;

  background:

    linear-gradient(
      135deg,
      rgba(10,22,48,.98),
      rgba(5,12,28,.98)
    );

}


.search-card:before{

  content:"";

  position:absolute;

  width:220px;
  height:220px;

  border-radius:50%;

  background:
    rgba(40,120,255,.10);

  filter:blur(40px);

  right:-90px;

  top:-110px;

}


.search-card label{

  display:block;

  text-align:left;

  color:#9aabc2;

  font-size:10px;

  font-weight:900;

  letter-spacing:1px;

  margin-bottom:10px;

}


.search-row{

  display:flex;

  gap:10px;

  position:relative;

  z-index:2;

}


.search-row input{

  flex:1;

  min-width:0;

  border:
    1px solid
    rgba(255,255,255,.08);

  border-radius:16px;

  padding:17px;

  font-size:16px;

  outline:none;

  text-transform:uppercase;

  background:#fff;

  color:#101828;

  transition:.25s;

}


.search-row input:focus{

  box-shadow:
    0 0 0 4px
    rgba(40,120,255,.15);

}


.search-row button{

  border:0;

  border-radius:16px;

  padding:
    0
    25px;

  background:

    linear-gradient(
      135deg,
      #2878ff,
      #5b8cff
    );

  color:#fff;

  font-size:14px;

  font-weight:900;

  cursor:pointer;

  box-shadow:

    0 12px 35px
    rgba(40,120,255,.25);

  transition:.25s;

}


.search-row button:hover{

  transform:
    translateY(-2px);

  box-shadow:

    0 15px 40px
    rgba(40,120,255,.35);

}


.search-row button:disabled{

  opacity:.55;

  cursor:wait;

}


/* ERROR MESSAGE */

#message{

  display:none;

  margin-top:14px;

  padding:13px;

  border-radius:12px;

  background:#fff;

  color:#344054;

  text-align:left;

  font-size:13px;

}


/* =========================================================
   TITLE AFTER SEARCH
========================================================= */

.hero-title{

  margin-top:42px;

}


.hero-title h1{

  font-size:
    clamp(
      43px,
      9vw,
      76px
    );

  line-height:.98;

  letter-spacing:-4px;

  background:

    linear-gradient(
      120deg,
      #fff 15%,
      #a7cbff 42%,
      #6e98ff 68%,
      #fff 92%
    );

  -webkit-background-clip:text;

  background-clip:text;

  color:transparent;

}


.hero-title p{

  max-width:610px;

  margin:
    20px
    auto
    0;

  color:#8996aa;

  font-size:15px;

  line-height:1.7;

}


/* =========================================================
   RESULT
========================================================= */

.result{

  display:none;

  margin:
    10px
    0
    60px;

}


.result-card{

  position:relative;

  overflow:hidden;

  border:
    1px solid
    var(--border);

  border-radius:30px;

  background:

    linear-gradient(
      145deg,
      rgba(255,255,255,.075),
      rgba(255,255,255,.025)
    );

  backdrop-filter:
    blur(22px);

  -webkit-backdrop-filter:
    blur(22px);

  box-shadow:

    0 35px 100px
      rgba(0,0,0,.42),

    inset
    0 1px 0
    rgba(255,255,255,.08);

  animation:
    resultEnter
    .65s
    cubic-bezier(.2,.8,.2,1);

}


@keyframes resultEnter{

  from{

    opacity:0;

    transform:
      translateY(30px)
      scale(.97);

  }

  to{

    opacity:1;

    transform:none;

  }

}


/* =========================================================
   RESULT HEADER
========================================================= */

.result-head{

  position:relative;

  overflow:hidden;

  padding:30px;

  background:

    radial-gradient(
      circle at 90% 10%,
      rgba(40,120,255,.30),
      transparent 30%
    ),

    radial-gradient(
      circle at 10% 100%,
      rgba(128,92,255,.16),
      transparent 30%
    ),

    linear-gradient(
      135deg,
      #071633,
      #0b2451
    );

}


.result-head:before{

  content:"";

  position:absolute;

  width:280px;
  height:280px;

  border:
    1px solid
    rgba(255,255,255,.06);

  border-radius:50%;

  right:-110px;

  top:-145px;

}


.result-head:after{

  content:"";

  position:absolute;

  width:190px;
  height:190px;

  border:
    1px solid
    rgba(255,255,255,.05);

  border-radius:50%;

  right:-45px;

  top:-85px;

}


.result-head small{

  color:#8ea6c9;

  font-size:10px;

  font-weight:900;

  letter-spacing:1.2px;

}


.result-head h2{

  margin-top:6px;

  font-size:28px;

  word-break:break-word;

  position:relative;

  z-index:2;

}


/* =========================================================
   STATUS
========================================================= */

.status-pill{

  display:inline-flex;

  align-items:center;

  gap:9px;

  margin-top:16px;

  padding:
    9px
    15px;

  border-radius:50px;

  background:#fff;

  color:#111827;

  font-size:12px;

  font-weight:900;

  position:relative;

  z-index:3;

}


.status-dot{

  width:9px;

  height:9px;

  border-radius:50%;

  background:
    var(--green);

  box-shadow:
    0 0 0 5px
    rgba(32,209,122,.12);

}


.status-pill.cancelled{

  color:#a51f30;

}


.status-pill.cancelled
.status-dot{

  background:
    var(--red);

  box-shadow:
    0 0 0 5px
    rgba(255,79,97,.13);

}


/* =========================================================
   DETAILS
========================================================= */

.details{

  padding:
    25px
    30px
    5px;

  background:
    rgba(255,255,255,.025);

}


.detail{

  padding:
    17px
    0;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

}


.detail:last-child{

  border-bottom:0;

}


.detail label{

  display:block;

  color:#7e8da4;

  font-size:9px;

  font-weight:900;

  text-transform:uppercase;

  letter-spacing:1px;

  margin-bottom:7px;

}


.detail div{

  color:#e8eef8;

  font-size:15px;

  line-height:1.7;

  word-break:break-word;

}


/* =========================================================
   ADMIN REMARK
========================================================= */

.admin-update{

  position:relative;

  overflow:hidden;

  margin:
    20px
    30px;

  padding:21px;

  border-radius:21px;

  background:

    linear-gradient(
      135deg,
      rgba(40,120,255,.14),
      rgba(128,92,255,.07)
    );

  border:
    1px solid
    rgba(40,120,255,.25);

  box-shadow:
    0 12px 40px
    rgba(0,0,0,.12);

}


.admin-update:before{

  content:"";

  position:absolute;

  left:0;

  top:0;

  bottom:0;

  width:4px;

  background:

    linear-gradient(
      #2878ff,
      #805cff
    );

}


.admin-top{

  display:flex;

  align-items:center;

  gap:9px;

  margin-bottom:10px;

}


.admin-icon{

  width:30px;

  height:30px;

  display:grid;

  place-items:center;

  border-radius:10px;

  background:
    rgba(40,120,255,.14);

  border:
    1px solid
    rgba(40,120,255,.20);

  font-size:14px;

}


.admin-title{

  color:#91c3ff;

  font-size:13px;

  font-weight:900;

}


.admin-subtitle{

  color:#687890;

  font-size:9px;

  margin-top:2px;

}


.admin-text{

  color:#e2eafa;

  font-size:14px;

  line-height:1.75;

  white-space:pre-wrap;

  word-break:break-word;

}


.admin-date{

  margin-top:12px;

  padding-top:10px;

  border-top:
    1px solid
    rgba(255,255,255,.06);

  color:#718097;

  font-size:10px;

}


/* =========================================================
   CANCELLED
========================================================= */

.cancel-box{

  position:relative;

  overflow:hidden;

  margin:
    20px
    30px;

  padding:21px;

  border-radius:21px;

  background:

    linear-gradient(
      135deg,
      rgba(255,79,97,.12),
      rgba(255,255,255,.025)
    );

  border:
    1px solid
    rgba(255,79,97,.25);

}


.cancel-box:before{

  content:"";

  position:absolute;

  left:0;

  top:0;

  bottom:0;

  width:4px;

  background:
    linear-gradient(
      #ff4f61,
      #ff8a95
    );

}


.cancel-title{

  color:#ff7180;

  font-size:14px;

  font-weight:900;

  margin-bottom:9px;

}


.cancel-text{

  color:#f2c7cb;

  font-size:14px;

  line-height:1.7;

  white-space:pre-wrap;

}


/* =========================================================
   TIMELINE
========================================================= */

.timeline{

  padding:
    25px
    30px;

}


.timeline-head{

  display:flex;

  align-items:center;

  justify-content:space-between;

  margin-bottom:20px;

}


.timeline-head h3{

  font-size:18px;

}


.live{

  display:flex;

  align-items:center;

  gap:6px;

  color:#6fe4a5;

  font-size:9px;

  font-weight:900;

  letter-spacing:.6px;

}


.live-dot{

  width:7px;

  height:7px;

  border-radius:50%;

  background:#20d17a;

  animation:
    livePulse
    1.5s
    infinite;

}


@keyframes livePulse{

  50%{

    box-shadow:
      0 0 0 8px
      rgba(32,209,122,.10);

  }

}


.track{

  position:relative;

}


.track:before{

  content:"";

  position:absolute;

  left:15px;

  top:16px;

  bottom:16px;

  width:2px;

  background:
    rgba(255,255,255,.08);

}


.stage{

  position:relative;

  display:flex;

  gap:14px;

  padding-bottom:20px;

}


.stage:last-child{

  padding-bottom:0;

}


.stage-icon{

  width:32px;

  height:32px;

  flex:0 0 32px;

  display:grid;

  place-items:center;

  border-radius:50%;

  background:#172033;

  border:
    3px solid
    #0b1325;

  color:#66758b;

  font-size:12px;

  font-weight:900;

  z-index:2;

}


.stage.done
.stage-icon{

  background:#16a36a;

  color:#fff;

  box-shadow:
    0 0 0 5px
    rgba(22,163,106,.10);

}


.stage.current
.stage-icon{

  background:#2878ff;

  color:#fff;

  box-shadow:
    0 0 0 5px
    rgba(40,120,255,.10);

  animation:
    currentPulse
    1.8s
    infinite;

}


.stage.cancelled
.stage-icon{

  background:#dc3545;

  color:#fff;

  box-shadow:
    0 0 0 5px
    rgba(220,53,69,.10);

}


@keyframes currentPulse{

  50%{

    box-shadow:
      0 0 0 10px
      rgba(40,120,255,.06);

  }

}


.stage-title{

  color:#9aa8bd;

  font-size:14px;

  font-weight:800;

  padding-top:6px;

}


.stage.done
.stage-title{

  color:#d9e4f2;

}


.stage.current
.stage-title{

  color:#78b0ff;

}


.stage.cancelled
.stage-title{

  color:#ff7180;

}


.stage-note{

  color:#64748b;

  font-size:10px;

  margin-top:3px;

}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.actions{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;

  padding:
    0
    30px
    28px;

}


.action{

  border:
    1px solid
    rgba(255,255,255,.08);

  background:
    rgba(255,255,255,.035);

  color:#bdc8d8;

  border-radius:13px;

  padding:
    12px
    8px;

  font-size:11px;

  font-weight:900;

  cursor:pointer;

  transition:.25s;

}


.action:hover{

  transform:
    translateY(-2px);

  border-color:
    rgba(40,120,255,.3);

  background:
    rgba(40,120,255,.08);

  color:#fff;

}


.action.primary{

  background:
    rgba(40,120,255,.12);

  color:#75aeff;

  border-color:
    rgba(40,120,255,.25);

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  text-align:center;

  color:#56647a;

  font-size:10px;

  padding:
    0
    0
    35px;

}


.back{

  display:inline-block;

  margin-top:14px;

  color:#6fa8ff;

  text-decoration:none;

  font-weight:900;

}


/* =========================================================
   TOAST
========================================================= */

.toast{

  position:fixed;

  left:50%;

  bottom:25px;

  transform:
    translate(-50%,25px);

  opacity:0;

  pointer-events:none;

  z-index:9999;

  padding:
    13px
    18px;

  border-radius:14px;

  background:#101a2c;

  border:
    1px solid
    rgba(255,255,255,.1);

  color:#fff;

  font-size:12px;

  font-weight:900;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.5);

  transition:.3s;

  white-space:nowrap;

}


.toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  .container{
    width:94%;
  }


  .top{
    padding-top:18px;
  }


  .hero{
    padding-top:28px;
  }


  .hero-title{
    margin-top:34px;
  }


  .hero-title h1{

    font-size:45px;

    letter-spacing:-2.8px;

  }


  .hero-title p{

    font-size:13px;

  }


  .search-card{

    padding:18px;

  }


  .search-row{

    flex-direction:column;

  }


  .search-row button{

    padding:15px;

  }


  .result-card{

    border-radius:24px;

  }


  .result-head{

    padding:23px;

  }


  .result-head h2{

    font-size:23px;

  }


  .details,
  .timeline{

    padding-left:20px;

    padding-right:20px;

  }


  .admin-update,
  .cancel-box{

    margin-left:20px;

    margin-right:20px;

  }


  .actions{

    padding-left:20px;

    padding-right:20px;

    grid-template-columns:
      repeat(2,1fr);

  }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

  body{

    background:#fff;

    color:#111;

  }


  .top,
  .hero,
  .actions,
  .footer{

    display:none!important;

  }


  .result{

    display:block!important;

  }


  .result-card{

    background:#fff;

    color:#111;

    box-shadow:none;

    border:
      1px solid
      #ddd;

  }

}

</style>
</head>

<div class="container">

     BRAND

/* =========================================================
   SAFE HTML
========================================================= */

function escapeHTML(value){

  return String(
    value ?? "-"
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(timestamp){

  if(!timestamp)
    return "-";


  try{

    const date =
      timestamp.toDate
      ? timestamp.toDate()
      : new Date(timestamp);


    if(
      isNaN(
        date.getTime()
      )
    ){

      return "-";

    }


    return new Intl.DateTimeFormat(

      "en-IN",

      {
        dateStyle:"medium",
        timeStyle:"short"
      }

    ).format(date);


  }catch(error){

    return "-";

  }

}


/* =========================================================
   STATUS
========================================================= */

function statusInfo(status){

  const normalized =
    String(
      status ||
      "Submitted"
    )
    .toLowerCase()
    .trim();


  if(
    normalized.includes(
      "cancel"
    )
  ){

    return {

      current:3,

      label:
        status ||
        "Cancelled",

      type:
        "cancelled"

    };

  }


  if(
    normalized.includes(
      "resolve"
    )
  ){

    return {

      current:3,

      label:
        status ||
        "Resolved",

      type:
        "resolved"

    };

  }


  if(
    normalized.includes(
      "progress"
    )
    ||
    normalized.includes(
      "work"
    )
  ){

    return {

      current:2,

      label:
        status ||
        "In Progress",

      type:
        "progress"

    };

  }


  if(
    normalized.includes(
      "review"
    )
  ){

    return {

      current:1,

      label:
        status ||
        "Under Review",

      type:
        "review"

    };

  }


  return {

    current:0,

    label:
      status ||
      "Submitted",

    type:
      "submitted"

  };

}


/* =========================================================
   TIMELINE
========================================================= */

function timeline(status){

  const info =
    statusInfo(status);


  let stages;


  if(
    info.type ===
    "cancelled"
  ){

    stages = [

      "Submitted",

      "Under Review",

      "In Progress",

      "Cancelled"

    ];

  }else{

    stages = [

      "Submitted",

      "Under Review",

      "In Progress",

      "Resolved"

    ];

  }


  return stages.map(

    (stage,index)=>{


      const done =
        index <
        info.current;


      const current =
        index ===
        info.current;


      const cancelled =
        info.type ===
        "cancelled"
        &&
        current;


      return `

        <div
          class="stage
          ${done ? "done" : ""}
          ${current ? "current" : ""}
          ${cancelled ? "cancelled" : ""}">


          <div
            class="stage-icon">

            ${
              done
              ? "✓"
              : cancelled
              ? "×"
              : current
              ? "●"
              : "○"
            }

          </div>


          <div>

            <div
              class="stage-title">

              ${stage}

            </div>


            ${
              current

              ?

              `

              <div
                class="stage-note">

                ${
                  cancelled
                  ?
                  "Complaint cancelled"
                  :
                  "Current status"
                }

              </div>

              `

              :

              ""

            }

          </div>


        </div>

      `;

    }

  ).join("");

}


/* =========================================================
   CHECK COMPLAINT
   ORIGINAL FIRESTORE FLOW
========================================================= */

window.checkComplaint =
async function(){


  const complaintId =

    input.value
      .trim()
      .toUpperCase();


  result.style.display =
    "none";


  result.innerHTML =
    "";


  message.style.display =
    "none";


  if(!complaintId){

    message.textContent =
      "Please enter your Complaint ID.";

    message.style.display =
      "block";

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "Checking...";


  try{


    /* =====================================================
       ORIGINAL QUERY
    ===================================================== */

    const q =

      query(

        collection(
          db,
          "complaints"
        ),

        where(
          "complaintId",
          "==",
          complaintId
        )

      );


    const snapshot =
      await getDocs(q);


    if(
      snapshot.empty
    ){

      message.textContent =
        "Complaint not found. Please check the Complaint ID and try again.";

      message.style.display =
        "block";

      return;

    }


    const doc =
      snapshot.docs[0];


    currentComplaint = {

      docId:
        doc.id,

      ...doc.data()

    };


    renderComplaint(
      currentComplaint
    );


  }catch(error){

    console.error(error);


    message.textContent =
      "Unable to check status right now. Please try again.";


    message.style.display =
      "block";


  }finally{

    button.disabled =
      false;


    button.textContent =
      "Check Status →";

  }

};

/* =========================================================
   COPY ID
========================================================= */

window.copyID =
async function(){

  if(
    !currentComplaint
  )
    return;


  try{

    await navigator.clipboard.writeText(

      currentComplaint.complaintId

    );


    showToast(
      "✓ Complaint ID copied"
    );


  }catch(error){

    showToast(
      currentComplaint.complaintId
    );

  }

};

   REFRESH
========================================================= */

function(){

    !currentComplaint

    return;


  input.value =
    currentComplaint.complaintId;


  window.checkComplaint();

};


/* =========================================================
   SHARE
========================================================= */

window.shareComplaint =
async function(){

  if(
    !currentComplaint
  )
    return;


  const text =

`SK KGN TEAM Complaint

Complaint ID:
${currentComplaint.complaintId}

Current Status:
${currentComplaint.status || "Submitted"}`;


  if(
    navigator.share
  ){

    try{

      await navigator.share({

        title:
          "SK KGN TEAM Complaint",

        text:
          text,

        url:
          location.href

      });

    }catch(error){}


  }else{

    try{

      await navigator.clipboard.writeText(
        text
      );


      showToast(
        "✓ Complaint status copied"
      );


    }catch(error){

      showToast(
        "Unable to share"
      );

    }

  }

};

/* =========================================================
   TOAST
========================================================= */

function showToast(text){

  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  setTimeout(

    ()=>{

      toast.classList.remove(
        "show"
      );

    },

    3000

  );

}
