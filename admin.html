<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SK KGN TEAM - Admin Panel</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6fb;
    color:#172033;
}
header{
    background:linear-gradient(135deg,#071b3a,#0d4380);
    color:white;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    position:sticky;
    top:0;
    z-index:20;
}
.brand{
    display:flex;
    align-items:center;
    gap:12px;
}
.brand img{
    width:52px;
    height:52px;
    object-fit:cover;
    border-radius:12px;
    background:white;
}
.brand h1{
    margin:0;
    font-size:21px;
}
.brand p{
    margin:4px 0 0;
    opacity:.8;
    font-size:12px;
}
button{
    border:0;
    cursor:pointer;
    border-radius:9px;
    padding:11px 15px;
    font-weight:bold;
}
.logout{
    background:#fff;
    color:#0b3970;
}
.container{
    max-width:1400px;
    margin:auto;
    padding:20px;
}
.login-box{
    max-width:420px;
    margin:80px auto;
    background:white;
    padding:28px;
    border-radius:18px;
    box-shadow:0 10px 35px #0001;
}
.login-box h2{
    margin-top:0;
    color:#0b3970;
}
input,select,textarea{
    width:100%;
    padding:12px;
    border:1px solid #d5ddea;
    border-radius:9px;
    outline:none;
    font-size:14px;
    margin-top:6px;
    background:white;
}
input:focus,select:focus,textarea:focus{
    border-color:#1769aa;
}
label{
    display:block;
    margin-top:14px;
    font-size:13px;
    font-weight:bold;
}
.primary{
    background:#0b4d91;
    color:white;
}
.danger{
    background:#c62828;
    color:white;
}
.warning{
    background:#ef8b00;
    color:white;
}
.success{
    background:#198754;
    color:white;
}
.stats{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:12px;
    margin-bottom:20px;
}
.stat{
    background:white;
    border-radius:14px;
    padding:17px;
    box-shadow:0 5px 18px #0000000b;
}
.stat b{
    display:block;
    font-size:25px;
    margin-top:6px;
}
.toolbar{
    background:white;
    padding:16px;
    border-radius:15px;
    box-shadow:0 5px 18px #0000000b;
    margin-bottom:18px;
}
.filters{
    display:grid;
    grid-template-columns:2fr 1fr 1fr auto auto;
    gap:10px;
}
.table-wrap{
    background:white;
    border-radius:15px;
    overflow:auto;
    box-shadow:0 5px 18px #0000000b;
}
table{
    width:100%;
    border-collapse:collapse;
    min-width:950px;
}
th,td{
    padding:13px;
    border-bottom:1px solid #edf0f5;
    text-align:left;
    font-size:13px;
}
th{
    background:#f5f7fb;
    color:#31506e;
}
.badge{
    padding:5px 9px;
    border-radius:20px;
    font-size:11px;
    font-weight:bold;
    display:inline-block;
}
.submitted{background:#e3f2fd;color:#1565c0}
.review{background:#fff3cd;color:#8a6100}
.progress{background:#e8eaf6;color:#3949ab}
.resolved{background:#dff5e8;color:#157347}
.cancelled{background:#fde2e2;color:#b42318}
.view-btn{
    background:#0b4d91;
    color:white;
    padding:8px 11px;
    font-size:12px;
}
.empty{
    text-align:center;
    padding:35px;
    color:#777;
}
.overlay{
    display:none;
    position:fixed;
    inset:0;
    background:#0009;
    z-index:100;
    padding:15px;
    overflow:auto;
}
.modal{
    background:white;
    max-width:760px;
    margin:30px auto;
    border-radius:18px;
    overflow:hidden;
}
.modal-head{
    background:linear-gradient(135deg,#071b3a,#0d4380);
    color:white;
    padding:18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}
.modal-head h2{
    margin:0;
    font-size:19px;
}
.close{
    background:#ffffff22;
    color:white;
    font-size:20px;
    padding:5px 11px;
}
.modal-body{
    padding:20px;
}
.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}
.detail{
    background:#f6f8fb;
    padding:12px;
    border-radius:10px;
}
.detail.full{
    grid-column:1/-1;
}
.detail small{
    color:#697386;
    display:block;
    margin-bottom:5px;
}
.detail strong{
    word-break:break-word;
}
.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:18px;
}
hr{
    border:0;
    border-top:1px solid #e7ebf1;
    margin:20px 0;
}
#message{
    margin-top:12px;
    font-size:13px;
    font-weight:bold;
}
@media(max-width:900px){
    .stats{grid-template-columns:repeat(3,1fr)}
    .filters{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){
    header{padding:13px}
    .brand img{width:43px;height:43px}
    .brand h1{font-size:17px}
    .container{padding:12px}
    .stats{grid-template-columns:repeat(2,1fr)}
    .filters{grid-template-columns:1fr}
    .detail-grid{grid-template-columns:1fr}
    .detail.full{grid-column:auto}
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="Logo.jpg" alt="SK KGN TEAM">
        <div>
            <h1>SK KGN TEAM</h1>
            <p>Admin Control Panel</p>
        </div>
    </div>

    <button class="logout" id="logoutBtn" style="display:none">
        Logout
    </button>
</header>

<div id="loginSection" class="login-box">
    <h2>🔐 Admin Login</h2>

    <label>Email</label>
    <input id="email" type="email" placeholder="Admin Email">

    <label>Password</label>
    <input id="password" type="password" placeholder="Password">

    <button class="primary" style="width:100%;margin-top:18px" id="loginBtn">
        Login
    </button>

    <div id="loginMessage"></div>
</div>

<div id="adminSection" style="display:none">
<div class="container">

    <div class="stats">
        <div class="stat">Total <b id="total">0</b></div>
        <div class="stat">Submitted <b id="submitted">0</b></div>
        <div class="stat">Review <b id="review">0</b></div>
        <div class="stat">Progress <b id="progress">0</b></div>
        <div class="stat">Resolved <b id="resolved">0</b></div>
        <div class="stat">Cancelled <b id="cancelled">0</b></div>
    </div>

    <div class="toolbar">
        <div class="filters">
            <input id="search" placeholder="🔎 ID / Name / Mobile / Subject">

            <select id="statusFilter">
                <option value="">All Status</option>
                <option>Submitted</option>
                <option>Under Review</option>
                <option>In Progress</option>
                <option>Resolved</option>
                <option>Cancelled</option>
            </select>

            <select id="sortFilter">
                <option value="new">Newest First</option>
                <option value="old">Oldest First</option>
                <option value="name">Name A-Z</option>
                <option value="status">Status</option>
            </select>

            <button class="primary" onclick="loadComplaints()">Refresh</button>

            <button onclick="clearFilters()">Clear</button>
        </div>
    </div>

    <div class="table-wrap">
        <table>
            <thead>
                <tr>
                    <th>Complaint ID</th>
                    <th>Name</th>
                    <th>Mobile</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="complaintTable">
                <tr>
                    <td colspan="7" class="empty">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

</div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay">
<div class="modal">

    <div class="modal-head">
        <h2>Complaint Management</h2>
        <button class="close" onclick="closeModal()">×</button>
    </div>

    <div class="modal-body">

        <div class="detail-grid">

            <div class="detail">
                <small>Complaint ID</small>
                <strong id="mId"></strong>
            </div>

            <div class="detail">
                <small>Submitted Date</small>
                <strong id="mDate"></strong>
            </div>

            <div class="detail">
                <small>Applicant Name</small>
                <strong id="mName"></strong>
            </div>

            <div class="detail">
                <small>Mobile</small>
                <strong id="mMobile"></strong>
            </div>

            <div class="detail full">
                <small>Subject</small>
                <strong id="mSubject"></strong>
            </div>

            <div class="detail full">
                <small>Complaint Details</small>
                <strong id="mDetails"></strong>
            </div>

        </div>

        <hr>

        <label>Complaint Status</label>

        <select id="mStatus">
            <option>Submitted</option>
            <option>Under Review</option>
            <option>In Progress</option>
            <option>Resolved</option>
            <option>Cancelled</option>
        </select>

        <label>Admin Remark / Action Taken</label>

        <textarea id="mRemark" rows="5"
        placeholder="Yahan admin apna remark, action taken ya cancellation reason likh sakta hai..."></textarea>

        <div class="actions">

            <button class="primary" onclick="saveComplaint()">
                💾 Save Changes
            </button>

            <button class="success" onclick="callCustomer()">
                📞 Call Customer
            </button>

            <button class="success" onclick="whatsappCustomer()">
                💬 WhatsApp
            </button>

            <button class="danger" onclick="deleteComplaint()">
                🗑️ Delete Complaint
            </button>

            <button onclick="closeModal()">
                Close
            </button>

        </div>

        <div id="saveMessage"></div>

    </div>
</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import {
    getFirestore,
    collection,
    getDocs,
    doc,
    updateDoc,
    deleteDoc
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* =========================
   FIREBASE CONFIG
========================= */

const firebaseConfig = {
    apiKey: "AIzaSyD9w0JXQw2F8q2J1v6wQkKfJfQ3x8xK0x",
    authDomain: "sk-kgn-team.firebaseapp.com",
    projectId: "sk-kgn-team",
    storageBucket: "sk-kgn-team.firebasestorage.app",
    messagingSenderId: "228612697498",
    appId: "1:228612697498:web:a304b57bf5a59d2933de23"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);


/* =========================
   VARIABLES
========================= */

let complaints = [];
let selectedComplaint = null;


/* =========================
   LOGIN
========================= */

document.getElementById("loginBtn").onclick = async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(!email || !password){
        document.getElementById("loginMessage").innerHTML =
        "⚠️ Email aur password enter karein.";
        return;
    }

    try{

        await signInWithEmailAndPassword(auth,email,password);

        document.getElementById("loginMessage").innerHTML =
        "Login successful.";

    }catch(error){

        document.getElementById("loginMessage").innerHTML =
        "❌ Login failed: " + error.message;

    }

};


/* =========================
   AUTH STATE
========================= */

onAuthStateChanged(auth, async (user)=>{

    if(user){

        document.getElementById("loginSection").style.display="none";
        document.getElementById("adminSection").style.display="block";
        document.getElementById("logoutBtn").style.display="block";

        await loadComplaints();

    }else{

        document.getElementById("loginSection").style.display="block";
        document.getElementById("adminSection").style.display="none";
        document.getElementById("logoutBtn").style.display="none";

    }

});


/* =========================
   LOGOUT
========================= */

document.getElementById("logoutBtn").onclick = async ()=>{
    await signOut(auth);
};


/* =========================
   LOAD COMPLAINTS
========================= */

window.loadComplaints = async function(){

    const table = document.getElementById("complaintTable");

    table.innerHTML =
    `<tr><td colspan="7" class="empty">Loading complaints...</td></tr>`;

    try{

        const snapshot = await getDocs(collection(db,"complaints"));

        complaints = [];

        snapshot.forEach(item=>{

            complaints.push({
                docId:item.id,
                ...item.data()
            });

        });

        renderComplaints();

    }catch(error){

        table.innerHTML =
        `<tr><td colspan="7" class="empty">
        ❌ Complaints load nahi hui.<br><br>${error.message}
        </td></tr>`;

    }

};


/* =========================
   RENDER
========================= */

function renderComplaints(){

    let data = [...complaints];

    const search =
        document.getElementById("search").value.toLowerCase().trim();

    const status =
        document.getElementById("statusFilter").value;

    const sort =
        document.getElementById("sortFilter").value;


    if(search){

        data = data.filter(c => {

            const text = `
                ${c.complaintId || ""}
                ${c.name || ""}
                ${c.mobile || ""}
                ${c.subject || ""}
                ${c.details || ""}
            `.toLowerCase();

            return text.includes(search);

        });

    }


    if(status){
        data = data.filter(c =>
            (c.status || "Submitted") === status
        );
    }


    if(sort === "name"){

        data.sort((a,b)=>
            String(a.name||"").localeCompare(String(b.name||""))
        );

    }

    else if(sort === "status"){

        data.sort((a,b)=>
            String(a.status||"").localeCompare(String(b.status||""))
        );

    }

    else if(sort === "old"){

        data.sort((a,b)=>
            getDateValue(a)-getDateValue(b)
        );

    }

    else{

        data.sort((a,b)=>
            getDateValue(b)-getDateValue(a)
        );

    }


    updateStats();


    const table = document.getElementById("complaintTable");

    if(!data.length){

        table.innerHTML =
        `<tr><td colspan="7" class="empty">
        No complaints found.
        </td></tr>`;

        return;
    }


    table.innerHTML = data.map(c=>{

        const status = c.status || "Submitted";

        return `
        <tr>

            <td><b>${escapeHtml(c.complaintId || c.docId)}</b></td>

            <td>${escapeHtml(c.name || "-")}</td>

            <td>${escapeHtml(c.mobile || "-")}</td>

            <td>${escapeHtml(c.subject || "-")}</td>

            <td>
                <span class="badge ${statusClass(status)}">
                    ${escapeHtml(status)}
                </span>
            </td>

            <td>${formatDate(c.createdAt || c.submittedAt)}</td>

            <td>
                <button class="view-btn"
                onclick="openComplaint('${c.docId}')">
                    Manage
                </button>
            </td>

        </tr>
        `;

    }).join("");

}


/* =========================
   OPEN COMPLAINT
========================= */

window.openComplaint = function(docId){

    const c = complaints.find(x=>x.docId === docId);

    if(!c) return;

    selectedComplaint = c;

    document.getElementById("mId").textContent =
        c.complaintId || c.docId;

    document.getElementById("mDate").textContent =
        formatDate(c.createdAt || c.submittedAt);

    document.getElementById("mName").textContent =
        c.name || "-";

    document.getElementById("mMobile").textContent =
        c.mobile || "-";

    document.getElementById("mSubject").textContent =
        c.subject || "-";

    document.getElementById("mDetails").textContent =
        c.details || c.description || "-";

    document.getElementById("mStatus").value =
        c.status || "Submitted";

    document.getElementById("mRemark").value =
        c.adminRemark || c.adminNotes || "";

    document.getElementById("saveMessage").textContent="";

    document.getElementById("overlay").style.display="block";
};


/* =========================
   SAVE STATUS + REMARK
========================= */

window.saveComplaint = async function(){

    if(!selectedComplaint) return;

    const status =
        document.getElementById("mStatus").value;

    const remark =
        document.getElementById("mRemark").value.trim();

    const message =
        document.getElementById("saveMessage");

    message.textContent = "Saving...";

    try{

        const ref =
            doc(db,"complaints",selectedComplaint.docId);

        await updateDoc(ref,{

            status: status,

            adminRemark: remark,

            adminUpdatedAt: new Date().toISOString(),

            adminUpdatedBy:
                auth.currentUser?.email || "Admin"

        });


        selectedComplaint.status = status;
        selectedComplaint.adminRemark = remark;


        message.innerHTML =
        "✅ Complaint successfully updated.";

        await loadComplaints();

    }catch(error){

        message.innerHTML =
        "❌ Save failed: " + error.message;

    }

};


/* =========================
   DELETE COMPLAINT
========================= */

window.deleteComplaint = async function(){

    if(!selectedComplaint) return;

    const id =
        selectedComplaint.complaintId ||
        selectedComplaint.docId;


    const first =
        confirm(
        "⚠️ Kya aap complaint " +
        id +
        " ko DELETE karna chahte hain?"
        );

    if(!first) return;


    const second =
        confirm(
        "FINAL CONFIRMATION:\n\n" +
        "Ye complaint permanently delete ho jayegi.\n" +
        "Kya aap sure hain?"
        );

    if(!second) return;


    const message =
        document.getElementById("saveMessage");

    message.textContent = "Deleting...";


    try{

        await deleteDoc(
            doc(db,"complaints",selectedComplaint.docId)
        );


        message.innerHTML =
        "✅ Complaint deleted successfully.";

        complaints =
            complaints.filter(
                x=>x.docId !== selectedComplaint.docId
            );

        selectedComplaint = null;

        setTimeout(()=>{

            closeModal();
            renderComplaints();

        },700);


    }catch(error){

        message.innerHTML =
        "❌ Delete failed: " + error.message;

    }

};


/* =========================
   CALL
========================= */

window.callCustomer = function(){

    if(!selectedComplaint) return;

    const mobile =
        String(selectedComplaint.mobile || "")
        .replace(/\D/g,"");

    if(!mobile){

        alert("Mobile number available nahi hai.");
        return;

    }

    window.location.href = "tel:" + mobile;
};


/* =========================
   WHATSAPP
========================= */

window.whatsappCustomer = function(){

    if(!selectedComplaint) return;

    let mobile =
        String(selectedComplaint.mobile || "")
        .replace(/\D/g,"");

    if(mobile.length === 10){
        mobile = "91" + mobile;
    }

    if(!mobile){

        alert("Mobile number available nahi hai.");
        return;

    }


    const id =
        selectedComplaint.complaintId ||
        selectedComplaint.docId;


    const message =
        `Namaste, SK KGN TEAM se aapki complaint ${id} ke sambandh mein sampark kiya ja raha hai.`;


    window.open(
        "https://wa.me/" +
        mobile +
        "?text=" +
        encodeURIComponent(message),
        "_blank"
    );

};


/* =========================
   CLOSE MODAL
========================= */

window.closeModal = function(){

    document.getElementById("overlay").style.display="none";

    selectedComplaint = null;

};


/* =========================
   FILTERS
========================= */

document.getElementById("search")
.addEventListener("input",renderComplaints);

document.getElementById("statusFilter")
.addEventListener("change",renderComplaints);

document.getElementById("sortFilter")
.addEventListener("change",renderComplaints);


window.clearFilters = function(){

    document.getElementById("search").value="";
    document.getElementById("statusFilter").value="";
    document.getElementById("sortFilter").value="new";

    renderComplaints();

};


/* =========================
   STATS
========================= */

function updateStats(){

    const count = status =>
        complaints.filter(c =>
            (c.status || "Submitted") === status
        ).length;


    document.getElementById("total").textContent =
        complaints.length;

    document.getElementById("submitted").textContent =
        count("Submitted");

    document.getElementById("review").textContent =
        count("Under Review");

    document.getElementById("progress").textContent =
        count("In Progress");

    document.getElementById("resolved").textContent =
        count("Resolved");

    document.getElementById("cancelled").textContent =
        count("Cancelled");

}


/* =========================
   HELPERS
========================= */

function statusClass(status){

    if(status === "Under Review") return "review";

    if(status === "In Progress") return "progress";

    if(status === "Resolved") return "resolved";

    if(status === "Cancelled") return "cancelled";

    return "submitted";
}


function getDateValue(c){

    if(!c) return 0;

    if(typeof c === "number") return c;

    if(c.seconds) return c.seconds * 1000;

    const t = Date.parse(c);

    return isNaN(t) ? 0 : t;
}


function formatDate(value){

    if(!value) return "-";

    let date;

    if(value.seconds){

        date =
            new Date(value.seconds * 1000);

    }else{

        date =
            new Date(value);

    }

    if(isNaN(date.getTime())) return "-";

    return date.toLocaleString("en-IN",{
        day:"2-digit",
        month:"short",
        year:"numeric",
        hour:"2-digit",
        minute:"2-digit"
    });

}


function escapeHtml(value){

    return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

</script>

</body>
</html>
