<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152f">
<title>Track Complaint — SK KGN TEAM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
--blue:#2563eb;
--dark:#07152f;
--dark2:#111827;
--green:#16a34a;
--red:#dc2626;
--orange:#ea580c;
--gold:#f59e0b;
--muted:#667085;
--line:#e4e7ec;
}

body{
font-family:Inter,Arial,sans-serif;
background:
radial-gradient(circle at 10% 10%,#2563eb14,transparent 28%),
radial-gradient(circle at 90% 30%,#0ea5e914,transparent 25%),
#f5f7fb;
color:#101828;
min-height:100vh;
}

.container{
width:min(800px,94%);
margin:auto;
}

.top{
padding:25px 0 10px;
}

.brand{
display:flex;
align-items:center;
gap:11px;
text-decoration:none;
color:#111827;
font-size:20px;
font-weight:900;
}

.brand img{
width:45px;
height:45px;
border-radius:50%;
object-fit:contain;
background:#fff;
box-shadow:0 6px 22px #0002;
}

.hero{
text-align:center;
padding:38px 0 25px;
}

.badge{
display:inline-block;
padding:9px 16px;
border-radius:30px;
background:#eaf1ff;
color:#164a9c;
font-size:10px;
font-weight:900;
letter-spacing:.8px;
margin-bottom:15px;
animation:pulse 2s infinite;
}

@keyframes pulse{
50%{box-shadow:0 0 0 8px #2563eb12}
}

h1{
font-size:clamp(35px,8vw,57px);
letter-spacing:-2.5px;
line-height:1.05;
}

.hero p{
margin:14px auto 0;
max-width:600px;
color:var(--muted);
font-size:15px;
line-height:1.6;
}

.search-card{
margin-top:28px;
padding:25px;
border-radius:28px;
background:linear-gradient(145deg,#07152f,#164a9c);
box-shadow:0 25px 70px #07152f40;
position:relative;
overflow:hidden;
}

.search-card:after{
content:"";
position:absolute;
width:220px;
height:220px;
border:1px solid #ffffff14;
border-radius:50%;
right:-100px;
top:-100px;
}

.search-card label{
display:block;
text-align:left;
color:#cbd5e1;
font-size:10px;
font-weight:900;
letter-spacing:.8px;
margin-bottom:8px;
}

.search-row{
display:flex;
gap:10px;
position:relative;
z-index:2;
}

.search-row input{
flex:1;
min-width:0;
border:0;
border-radius:15px;
padding:16px;
font-size:15px;
outline:none;
text-transform:uppercase;
}

.search-row button{
border:0;
border-radius:15px;
padding:0 20px;
background:#2563eb;
color:#fff;
font-weight:900;
cursor:pointer;
}

.search-row button:disabled{
opacity:.6;
}

#message{
display:none;
margin-top:14px;
padding:13px;
background:#fff;
border-radius:12px;
font-size:13px;
text-align:left;
}

.result{
display:none;
margin:25px 0 55px;
}

.result-card{
background:#fff;
border-radius:30px;
overflow:hidden;
border:1px solid #e4e7ec;
box-shadow:0 25px 70px #10182818;
animation:enter .55s ease;
}

@keyframes enter{
from{opacity:0;transform:translateY(25px) scale(.98)}
to{opacity:1;transform:none}
}

.result-head{
padding:28px;
color:#fff;
background:
radial-gradient(circle at 90% 10%,#3b82f655,transparent 30%),
linear-gradient(135deg,#07152f,#164a9c);
position:relative;
overflow:hidden;
}

.result-head:after{
content:"";
position:absolute;
width:190px;
height:190px;
border:1px solid #ffffff18;
border-radius:50%;
right:-80px;
bottom:-100px;
}

.result-head small{
color:#cbd5e1;
font-size:10px;
font-weight:800;
letter-spacing:1px;
}

.result-head h2{
font-size:27px;
margin-top:5px;
word-break:break-word;
}

.status-pill{
display:inline-flex;
align-items:center;
gap:8px;
margin-top:15px;
padding:9px 14px;
border-radius:30px;
background:#fff;
color:#111827;
font-size:12px;
font-weight:900;
position:relative;
z-index:2;
}

.status-dot{
width:9px;
height:9px;
border-radius:50%;
background:#22c55e;
}

.status-pill.cancelled{
color:#991b1b;
}

.status-pill.cancelled .status-dot{
background:#dc2626;
}

.details{
padding:24px;
}

.detail{
padding:16px 0;
border-bottom:1px solid #edf0f4;
}

.detail:last-child{
border-bottom:0;
}

.detail label{
display:block;
color:#667085;
font-size:10px;
font-weight:900;
text-transform:uppercase;
letter-spacing:.7px;
margin-bottom:6px;
}

.detail div{
font-size:15px;
line-height:1.7;
word-break:break-word;
}

/* ADMIN UPDATE */

.admin-update{
margin:0 24px 22px;
padding:20px;
border-radius:20px;
background:linear-gradient(135deg,#eff6ff,#fff);
border:1px solid #bfdbfe;
position:relative;
overflow:hidden;
animation:updateIn .5s ease;
}

@keyframes updateIn{
from{opacity:0;transform:translateX(-12px)}
to{opacity:1;transform:none}
}

.admin-update:before{
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:5px;
background:linear-gradient(#2563eb,#7c3aed);
}

.admin-title{
font-size:15px;
font-weight:900;
color:#164a9c;
margin-bottom:8px;
}

.admin-text{
font-size:14px;
line-height:1.7;
color:#344054;
white-space:pre-wrap;
}

.admin-date{
margin-top:9px;
font-size:10px;
color:#98a2b3;
}

/* CANCEL */

.cancel-box{
margin:0 24px 22px;
padding:20px;
border-radius:20px;
background:linear-gradient(135deg,#fff1f2,#fff);
border:1px solid #fecdd3;
}

.cancel-title{
font-size:16px;
font-weight:900;
color:#b42318;
margin-bottom:7px;
}

.cancel-text{
font-size:14px;
line-height:1.7;
color:#7f1d1d;
white-space:pre-wrap;
}

/* TIMELINE */

.timeline{
padding:0 24px 25px;
}

.timeline h3{
font-size:19px;
margin-bottom:20px;
}

.track{
position:relative;
}

.track:before{
content:"";
position:absolute;
left:15px;
top:16px;
bottom:16px;
width:2px;
background:#e4e7ec;
}

.stage{
position:relative;
display:flex;
gap:14px;
padding-bottom:19px;
animation:stage .4s ease both;
}

@keyframes stage{
from{opacity:0;transform:translateX(-10px)}
to{opacity:1;transform:none}
}

.stage-icon{
width:32px;
height:32px;
flex:0 0 32px;
border-radius:50%;
display:grid;
place-items:center;
background:#eef0f3;
color:#98a2b3;
font-weight:900;
z-index:2;
border:3px solid #fff;
}

.stage.done .stage-icon{
background:#16a34a;
color:#fff;
}

.stage.current .stage-icon{
background:#2563eb;
color:#fff;
box-shadow:0 0 0 5px #dbeafe;
animation:current 1.7s infinite;
}

@keyframes current{
50%{box-shadow:0 0 0 10px #dbeafe55}
}

.stage.cancelled .stage-icon{
background:#dc2626;
color:#fff;
box-shadow:0 0 0 5px #fee2e2;
}

.stage-title{
font-weight:900;
font-size:14px;
padding-top:6px;
color:#344054;
}

.stage.current .stage-title{
color:#164a9c;
}

.stage.cancelled .stage-title{
color:#b42318;
}

.stage-note{
font-size:10px;
color:#98a2b3;
margin-top:3px;
}

/* ACTIONS */

.actions{
padding:0 24px 24px;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:9px;
}

.action{
border:1px solid #e4e7ec;
background:#fff;
border-radius:13px;
padding:12px 8px;
font-size:11px;
font-weight:900;
cursor:pointer;
transition:.2s;
}

.action:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px #10182812;
}

.action.primary{
background:#eff6ff;
color:#1d4ed8;
}

/* FEEDBACK */

.feedback{
margin:0 24px 23px;
padding:21px;
border-radius:22px;
background:linear-gradient(145deg,#07152f,#111827);
color:#fff;
box-shadow:0 18px 40px #07152f30;
}

.feedback h3{
font-size:17px;
}

.feedback p{
font-size:11px;
color:#9ca3af;
margin:5px 0 14px;
}

.rating{
display:flex;
gap:7px;
margin-bottom:12px;
}

.rating button{
width:43px;
height:43px;
border:1px solid #374151;
background:#1f2937;
border-radius:12px;
font-size:18px;
cursor:pointer;
transition:.2s;
}

.rating button.selected{
background:#f59e0b;
border-color:#f59e0b;
transform:translateY(-2px);
}

.feedback textarea{
width:100%;
min-height:75px;
resize:vertical;
border:1px solid #374151;
background:#0b1220;
color:#fff;
border-radius:13px;
padding:12px;
outline:none;
font-family:inherit;
}

.feedback-send{
margin-top:10px;
border:0;
border-radius:12px;
background:#2563eb;
color:#fff;
padding:12px 16px;
font-weight:900;
cursor:pointer;
}

/* REMINDER */

.reminder{
margin:0 24px 25px;
padding:20px;
border-radius:21px;
background:linear-gradient(135deg,#fffbeb,#fff);
border:1px solid #fde68a;
}

.reminder h3{
font-size:16px;
}

.reminder p{
margin:5px 0 13px;
font-size:11px;
line-height:1.6;
color:#667085;
}

.reminder-row{
display:flex;
gap:8px;
}

.reminder input{
flex:1;
border:1px solid #e4e7ec;
border-radius:11px;
padding:11px;
}

.reminder button{
border:0;
border-radius:11px;
background:#f59e0b;
color:#fff;
font-weight:900;
padding:0 15px;
cursor:pointer;
}

/* FOOTER */

.footer{
text-align:center;
color:#98a2b3;
font-size:11px;
padding-bottom:35px;
}

.back{
display:inline-block;
margin-top:15px;
color:#164a9c;
font-weight:900;
text-decoration:none;
}

/* TOAST */

.toast{
position:fixed;
left:50%;
bottom:24px;
transform:translate(-50%,20px);
background:#111827;
color:#fff;
padding:13px 17px;
border-radius:13px;
font-size:12px;
font-weight:900;
opacity:0;
pointer-events:none;
transition:.3s;
z-index:9999;
}

.toast.show{
opacity:1;
transform:translate(-50%,0);
}

@media(max-width:560px){

.container{width:94%}

.search-card{
padding:18px;
border-radius:23px;
}

.search-row{
flex-direction:column;
}

.search-row button{
padding:15px;
}

.result-card{
border-radius:23px;
}

.result-head{
padding:23px;
}

.details,.timeline{
padding-left:19px;
padding-right:19px;
}

.admin-update,
.cancel-box,
.feedback,
.reminder{
margin-left:19px;
margin-right:19px;
}

.actions{
padding-left:19px;
padding-right:19px;
grid-template-columns:repeat(2,1fr);
}

.reminder-row{
flex-direction:column;
}

.reminder button{
padding:12px;
}

}

@media print{

.top,.hero,.actions,.feedback,.reminder,.footer{
display:none!important;
}

.result{
display:block!important;
margin:0;
}

.result-card{
box-shadow:none;
}

}
</style>
</head>

<body>

<div class="container">

<div class="top">
<a class="brand" href="index.html">
<img src="Logo.jpg" alt="SK KGN TEAM">
<span>SK KGN TEAM</span>
</a>
</div>

<section class="hero">

<div class="badge">🔐 SECURE COMPLAINT TRACKING</div>

<h1>Track Your Complaint</h1>

<p>
Enter your Complaint ID to view the latest status,
official updates and complaint information.
</p>

<div class="search-card">

<label>COMPLAINT ID</label>

<div class="search-row">

<input
id="complaintId"
placeholder="SKKGN-XXXXXX"
autocomplete="off"
spellcheck="false">

<button id="checkBtn">
Check Status →
</button>

</div>

<div id="message"></div>

</div>

</section>

<section id="result" class="result"></section>

<div class="footer">
SK KGN TEAM • Complaint Tracking System<br>
<a class="back" href="index.html">← Back to Website</a>
</div>

</div>

<div id="toast" class="toast"></div>


<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getFirestore,
collection,
query,
where,
getDocs,
addDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


/* FIREBASE */

const firebaseConfig={

apiKey:"AIzaSyAOdyFtVEoAeVd1TnWjaXrkPBPTz9oHKVQ",

authDomain:"sk-kgn-team.firebaseapp.com",

databaseURL:
"https://sk-kgn-team-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:"sk-kgn-team",

storageBucket:
"sk-kgn-team.firebasestorage.app",

messagingSenderId:"228612697498",

appId:
"1:228612697498:web:a304b57bf5a59d2933de23",

measurementId:"G-BXWT6BPTB6"

};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);


let currentComplaint=null;
let selectedRating=0;


/* ELEMENTS */

const input=document.getElementById("complaintId");
const button=document.getElementById("checkBtn");
const message=document.getElementById("message");
const result=document.getElementById("result");
const toast=document.getElementById("toast");


/* ESCAPE */

function escapeHTML(value){

return String(value ?? "-")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* DATE */

function formatDate(value){

if(!value)return "-";

try{

const d=value.toDate
?value.toDate()
:new Date(value);

if(isNaN(d.getTime()))return "-";

return new Intl.DateTimeFormat(
"en-IN",
{
dateStyle:"medium",
timeStyle:"short"
}
).format(d);

}catch(e){

return "-";

}

}


/* STATUS */

function statusInfo(status){

const s=String(status||"Submitted")
.toLowerCase()
.trim();

if(s.includes("cancel"))
return{
type:"cancelled",
label:"Cancelled"
};

if(s.includes("resolve"))
return{
type:"resolved",
label:"Resolved"
};

if(s.includes("progress")||s.includes("work"))
return{
type:"progress",
label:"In Progress"
};

if(s.includes("review"))
return{
type:"review",
label:"Under Review"
};

return{
type:"submitted",
label:"Submitted"
};

}


/* TIMELINE */

function makeTimeline(status){

const info=statusInfo(status);

let stages;

if(info.type==="cancelled"){

stages=[
"Submitted",
"Under Review",
"In Progress",
"Cancelled"
];

}else{

stages=[
"Submitted",
"Under Review",
"In Progress",
"Resolved"
];

}

let current=0;

if(info.type==="review")current=1;
if(info.type==="progress")current=2;
if(info.type==="resolved")current=3;
if(info.type==="cancelled")current=3;


return stages.map((stage,i)=>{

const done=i<current;
const now=i===current;
const cancelled=
info.type==="cancelled"&&now;

return`

<div class="stage
${done?"done":""}
${now?"current":""}
${cancelled?"cancelled":""}">

<div class="stage-icon">

${
done
?"✓"
:cancelled
?"×"
:now
?"●"
:"○"
}

</div>

<div>

<div class="stage-title">
${stage}
</div>

${
now
?
`<div class="stage-note">
${
cancelled
?"Complaint cancelled"
:"Current status"
}
</div>`
:""
}

</div>

</div>

`;

}).join("");

}


/* CHECK */

async function checkComplaint(){

const id=input.value.trim().toUpperCase();

result.style.display="none";
result.innerHTML="";
message.style.display="none";


if(!id){

message.textContent=
"Please enter your Complaint ID.";

message.style.display="block";

return;

}


button.disabled=true;
button.textContent="Checking...";


try{

const q=query(
collection(db,"complaints"),
where("complaintId","==",id)
);

const snapshot=await getDocs(q);


if(snapshot.empty){

message.innerHTML=
"❌ Complaint not found.<br>Please check your Complaint ID.";

message.style.display="block";

return;

}


const d=snapshot.docs[0];

currentComplaint={
docId:d.id,
...d.data()
};

renderComplaint(currentComplaint);


}catch(error){

console.error(error);

message.textContent=
"Unable to check status right now.";

message.style.display="block";

}finally{

button.disabled=false;
button.textContent="Check Status →";

}

}

window.checkComplaint=checkComplaint;


/* RENDER */

function renderComplaint(data){

const info=statusInfo(data.status);

const remark=
data.adminRemark||
data.adminNotes||
"";

const updated=
data.adminUpdatedAt||
data.updatedAt||
null;


const isCancelled=
info.type==="cancelled";


result.innerHTML=`

<div class="result-card">

<div class="result-head">

<small>COMPLAINT ID</small>

<h2>
${escapeHTML(data.complaintId)}
</h2>

<div class="status-pill ${isCancelled?"cancelled":""}">

<span class="status-dot"></span>

${escapeHTML(info.label)}

</div>

</div>


<div class="details">

<div class="detail">
<label>Applicant Name</label>
<div>${escapeHTML(data.name)}</div>
</div>

<div class="detail">
<label>Subject</label>
<div>${escapeHTML(data.subject)}</div>
</div>

<div class="detail">
<label>Complaint Details</label>
<div>${escapeHTML(data.details)}</div>
</div>

<div class="detail">
<label>Submitted On</label>
<div>${formatDate(data.createdAt)}</div>
</div>

</div>


${
remark && isCancelled
?

`<div class="cancel-box">

<div class="cancel-title">
❌ Complaint Cancelled
</div>

<div class="cancel-text">
${escapeHTML(remark)}
</div>

${
updated
?
`<div class="admin-date">
Last updated: ${formatDate(updated)}
</div>`
:""
}

</div>`

:

remark

?

`<div class="admin-update">

<div class="admin-title">
📝 Latest Admin Update
</div>

<div class="admin-text">
${escapeHTML(remark)}
</div>

${
updated
?
`<div class="admin-date">
Last updated: ${formatDate(updated)}
</div>`
:""
}

</div>`

:""

}


<div class="timeline">

<h3>Complaint Progress</h3>

<div class="track">
${makeTimeline(data.status)}
</div>

</div>


<div class="actions">

<button class="action primary"
onclick="copyID()">
📋 Copy ID
</button>

<button class="action"
onclick="refreshComplaint()">
🔄 Refresh
</button>

<button class="action"
onclick="shareComplaint()">
📤 Share
</button>

<button class="action"
onclick="window.print()">
🖨️ Print
</button>

<button class="action"
onclick="callSupport()">
📞 Call
</button>

<button class="action"
onclick="whatsappSupport()">
💬 WhatsApp
</button>

</div>


<!-- FEEDBACK -->

<div class="feedback">

<h3>⭐ Give Your Feedback</h3>

<p>
Your feedback is connected to this complaint and is stored in our system.
</p>

<div class="rating">

<button onclick="selectRating(1)">😞</button>
<button onclick="selectRating(2)">😐</button>
<button onclick="selectRating(3)">🙂</button>
<button onclick="selectRating(4)">😊</button>
<button onclick="selectRating(5)">🤩</button>

</div>

<textarea
id="feedbackText"
placeholder="Write your genuine feedback..."></textarea>

<button
class="feedback-send"
onclick="sendFeedback()">

Submit Feedback →

</button>

</div>


<!-- TEAM REMINDER -->

<div class="reminder">

<h3>⏰ Set Team Follow-up Reminder</h3>

<p>
This reminder is for SK KGN TEAM follow-up.
Choose a date within the next 30 days.
Your reminder will be saved with this complaint so the team can see it in the Admin Panel.
</p>

<div class="reminder-row">

<input
id="reminderTime"
type="datetime-local">

<button onclick="saveReminder()">
Set Reminder
</button>

</div>

</div>


</div>

`;

result.style.display="block";

result.scrollIntoView({
behavior:"smooth",
block:"start"
});

setReminderLimit();

}


/* COPY */

window.copyID=async function(){

if(!currentComplaint)return;

try{

await navigator.clipboard.writeText(
currentComplaint.complaintId
);

showToast("✅ Complaint ID copied");

}catch(e){

showToast(currentComplaint.complaintId);

}

};


/* REFRESH */

window.refreshComplaint=function(){

if(!currentComplaint)return;

input.value=currentComplaint.complaintId;

checkComplaint();

};


/* SHARE */

window.shareComplaint=async function(){

if(!currentComplaint)return;

const text=
`SK KGN TEAM Complaint\n\n`+
`Complaint ID: ${currentComplaint.complaintId}\n`+
`Status: ${currentComplaint.status||"Submitted"}`;

if(navigator.share){

try{

await navigator.share({
title:"SK KGN TEAM Complaint",
text:text,
url:location.href
});

}catch(e){}

}else{

try{

await navigator.clipboard.writeText(text);

showToast("✅ Status copied");

}catch(e){

showToast(text);

}

}

};


/* CALL */

window.callSupport=function(){

/* RATING */

window.selectRating=function(rating){

selectedRating=rating;

document
.querySelectorAll(".rating button")
.forEach((btn,index)=>{

btn.classList.toggle(
"selected",
index+1===rating
);

});

};


/* FEEDBACK -> FIRESTORE */

window.sendFeedback=async function(){

if(!currentComplaint)return;


if(!selectedRating){

showToast("⭐ Please select a rating");

return;

}


const text=
document.getElementById("feedbackText")
.value.trim();


if(!text){

showToast("✍️ Please write your feedback");

return;

}


try{

await addDoc(

collection(
db,
"complaints",
currentComplaint.docId,
"feedback"
),

{

complaintId:
currentComplaint.complaintId,

rating:selectedRating,

message:text,

createdAt:serverTimestamp(),

source:"Complaint Status Page"

}

);


showToast(
"✅ Feedback submitted successfully"
);


document.getElementById(
"feedbackText"
).value="";


}catch(error){

console.error(error);

showToast(
"❌ Feedback submit nahi hua"
);

}

};


/* REMINDER LIMIT */

function setReminderLimit(){

const inputTime=
document.getElementById("reminderTime");

if(!inputTime)return;


const now=new Date();

const max=new Date();

max.setDate(
max.getDate()+30
);


function localValue(date){

const offset=
date.getTimezoneOffset()*60000;

return new Date(
date.getTime()-offset
)
.toISOString()
.slice(0,16);

}


inputTime.min=
localValue(now);

inputTime.max=
localValue(max);

}


/* SAVE TEAM REMINDER */

window.saveReminder=async function(){

if(!currentComplaint)return;


const reminderInput=
document.getElementById("reminderTime");


if(!reminderInput.value){

showToast(
"⏰ Reminder date select karein"
);

return;

}


const reminderDate=
new Date(reminderInput.value);


const now=new Date();

const max=new Date();

max.setDate(
max.getDate()+30
);


if(
reminderDate < now ||
reminderDate > max
){

showToast(
"⚠️ Reminder maximum 30 days ke andar hona chahiye"
);

return;

}


try{

await addDoc(

collection(
db,
"complaints",
currentComplaint.docId,
"reminders"
),

{

complaintId:
currentComplaint.complaintId,

reminderAt:
reminderDate,

createdAt:
serverTimestamp(),

status:"Pending",

source:"Customer Status Page"

}

);


showToast(
"⏰ Team follow-up reminder saved"
);


reminderInput.value="";


}catch(error){

console.error(error);

showToast(
"❌ Reminder save nahi hua"
);

}

};


/* TOAST */

function showToast(text){

toast.textContent=text;

toast.classList.add("show");

setTimeout(()=>{

toast.classList.remove("show");

},3000);

}


/* ENTER */

input.addEventListener(
"keydown",
e=>{

if(e.key==="Enter"){
checkComplaint();
}

}
);


/* URL ID */

const params=
new URLSearchParams(location.search);

const urlID=params.get("id");

if(urlID){

input.value=urlID.toUpperCase();

checkComplaint();

}

</script>
