<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, follow">

<title>404 – Page Not Found | SK KGN TEAM</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #ffffff;
    color: #172b46;
    font-family: "Noto Sans Devanagari", "Mangal", Arial, sans-serif;
    display: flex;
    flex-direction: column;
}

main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 560px;
    text-align: center;
}

.error-code {
    color: #0878bd;
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(90px, 20vw, 125px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -6px;
    margin-bottom: 22px;
}

h1 {
    color: #102445;
    font-size: clamp(23px, 5vw, 29px);
    font-weight: 800;
    line-height: 1.5;
    margin-bottom: 12px;
}

.message {
    color: #788494;
    font-size: 14px;
    line-height: 1.9;
}

.funny {
    margin-top: 17px;
    color: #34465c;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.9;
}

.funny span {
    color: #0878bd;
}

footer {
    text-align: center;
    padding: 17px;
    color: #a0a8b2;
    font-size: 11px;
    border-top: 1px solid #edf0f3;
}

@media(max-width: 480px) {
    main {
        padding: 25px 18px;
    }

    .error-code {
        font-size: 92px;
        margin-bottom: 17px;
    }

    h1 {
        font-size: 23px;
    }

    .message {
        font-size: 13px;
    }

    .funny {
        font-size: 14px;
        line-height: 1.85;
    }
}
</style>
</head>

<body>

<main>
    <div class="container">

        <div class="error-code">404</div>

        <h1>अरे! गलत पेज पर आ गए जनाब!</h1>

        <p class="message">
            माफ़ कीजिए, यह पेज यहाँ मौजूद नहीं है।
        </p>

        <p class="funny">
            ज़िंदगी में तो कभी सही रास्ता पकड़ नहीं पाए,<br>
            कम से कम <span>सही पेज</span> ही निकाल लेते! 😂
        </p>

    </div>
</main>

<footer>
    © 2026 SK KGN TEAM. All Rights Reserved.
</footer>

</body>
</html>
