<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142b4b">
<title>Login | SK KGN TEAM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:420px;
  background:#fff;
  padding:30px;
  border-radius:15px;
  border:1px solid #e2e7ee;
  box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.brand{
  font-size:23px;
  font-weight:800;
  color:#17365f;
}

.subtitle{
  color:#687386;
  font-size:14px;
  margin-top:7px;
  line-height:1.5;
}

h1{
  font-size:25px;
  margin-top:28px;
  margin-bottom:8px;
}

.description{
  color:#687386;
  font-size:14px;
  margin-bottom:22px;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd4df;
  border-radius:8px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#17365f;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#17365f;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google{
  background:#fff;
  color:#26364d;
  border:1px solid #ccd4df;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  font-size:13px;
  line-height:1.5;
  margin-top:13px;
  color:#b42318;
}

.links{
  text-align:center;
  font-size:14px;
  margin-top:22px;
  line-height:2;
}

a{
  color:#174b83;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">SK KGN TEAM</div>
  <div class="subtitle">Private Complaint Consultancy</div>

  <h1>Welcome Back</h1>
  <p class="description">
    Login to access your SK KGN TEAM account.
  </p>

  <form id="loginForm">

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
      required
    >

    <label for="password">Password</label>
    <input
      type="password"
      id="password"
      autocomplete="current-password"
      required
    >

    <button type="submit" id="loginBtn">
      Login
    </button>

  </form>

  <button class="google" type="button" id="googleBtn">
    Continue with Google
  </button>

  <div class="message" id="message" role="alert"></div>

  <div class="links">
    New user? <a href="register.html">Create Account</a>
    <br>
    <a href="index.html">← Back to Website</a>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  getDoc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAOdyFtVEoAeVdT1nWjaXRkPBPTZ9oHKQ",
  authDomain: "sk-kgn-team.firebaseapp.com",
  databaseURL: "https://sk-kgn-team-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sk-kgn-team",
  storageBucket: "sk-kgn-team.firebasestorage.app",
  messagingSenderId: "228612697498",
  appId: "1:228612697498:web:a304b57bf5a59d2933de23",
  measurementId: "G-BXWT6BPTB6"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const message = document.getElementById("message");
const loginBtn = document.getElementById("loginBtn");


// Check existing login
onAuthStateChanged(auth, user => {
  if(user){
    window.location.replace("dashboard.html");
  }
});


// Create profile if it does not exist
async function ensureUserProfile(user){

  const userRef = doc(db,"users",user.uid);
  const userSnap = await getDoc(userRef);

  if(!userSnap.exists()){

    await setDoc(userRef,{
      uid:user.uid,
      name:user.displayName || "",
      email:user.email || "",
      mobile:"",
      city:"",
      state:"",
      createdAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

  }
}


// Email login
document.getElementById("loginForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  message.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Please wait...";

  try{

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const result = await signInWithEmailAndPassword(
      auth,email,password
    );

    await ensureUserProfile(result.user);

    window.location.href = "dashboard.html";

  }
  catch(error){

    console.error(error);

    if(error.code === "auth/invalid-credential"){
      message.textContent = "Incorrect email or password.";
    }
    else{
      message.textContent = error.message;
    }

    loginBtn.disabled = false;
    loginBtn.textContent = "Login";

  }

});


// Google login
document.getElementById("googleBtn")
.addEventListener("click",async function(){

  message.textContent = "";

  try{

    const provider = new GoogleAuthProvider();

    const result = await signInWithPopup(auth,provider);

    await ensureUserProfile(result.user);

    window.location.href = "dashboard.html";

  }
  catch(error){

    console.error(error);
    message.textContent = error.message;

  }

});

</script>

</body>
</html>
