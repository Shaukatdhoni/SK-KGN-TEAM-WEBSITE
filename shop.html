<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SK KGN TEAM | Official Store</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#222;
}
header{
  height:70px;
  border-bottom:1px solid #e5e5e5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 6%;
}
.logo{font-size:21px;font-weight:800}
.logo span{color:#1769d2}
nav{display:flex;gap:27px}
nav a{
  text-decoration:none;
  color:#333;
  font-size:14px;
}
.cart{
  border:1px solid #ddd;
  background:white;
  padding:10px 17px;
  border-radius:4px;
  cursor:pointer;
}
.hero{
  background:#f4f6f8;
  padding:65px 8%;
  min-height:270px;
  display:flex;
  align-items:center;
}
.hero-content{max-width:560px}
.hero h1{
  font-size:38px;
  font-weight:700;
  margin-bottom:14px;
}
.hero p{
  color:#666;
  line-height:1.7;
  font-size:15px;
}
.hero a{
  display:inline-block;
  margin-top:22px;
  background:#1769d2;
  color:white;
  text-decoration:none;
  padding:12px 22px;
  border-radius:4px;
  font-size:14px;
}
.container{
  max-width:1250px;
  margin:auto;
  padding:45px 25px;
}
.heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  flex-wrap:wrap;
  gap:15px;
  margin-bottom:25px;
}
.heading h2{font-size:25px}
.search{
  padding:11px 13px;
  border:1px solid #ddd;
  border-radius:4px;
  width:240px;
  outline:none;
}
.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:28px;
}
.filters button{
  padding:9px 16px;
  background:white;
  border:1px solid #ddd;
  border-radius:3px;
  cursor:pointer;
  color:#444;
}
.filters button.active{
  background:#1769d2;
  color:white;
  border-color:#1769d2;
}
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:22px;
}
.product{
  border:1px solid #e7e7e7;
  background:white;
}
.product img{
  width:100%;
  height:220px;
  object-fit:contain;
  background:#f7f7f7;
  padding:12px;
}
.details{padding:15px}
.details h3{
  font-size:16px;
  margin-bottom:9px;
}
.details p{
  font-size:13px;
  color:#777;
  line-height:1.5;
  min-height:35px;
}
.price{
  font-size:19px;
  font-weight:bold;
  margin:13px 0;
}
.add{
  width:100%;
  padding:11px;
  background:#1769d2;
  color:white;
  border:0;
  border-radius:3px;
  cursor:pointer;
}
.add:disabled{background:#999}
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:65px 15px;
  color:#555;
  border:1px solid #eee;
}
.empty h3{font-size:22px;margin-bottom:10px}
.empty p{font-size:14px;color:#777}
footer{
  border-top:1px solid #eee;
  padding:25px;
  text-align:center;
  color:#777;
  font-size:13px;
}
.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0007;
  z-index:10;
}
.overlay.show{display:block}
.cart-panel{
  background:white;
  width:min(400px,100%);
  height:100%;
  margin-left:auto;
  padding:25px;
  overflow:auto;
}
.cart-title{
  display:flex;
  justify-content:space-between;
  margin-bottom:25px;
}
.cart-title button{
  border:0;background:white;font-size:25px;cursor:pointer;
}
.cart-item{
  padding:15px 0;
  border-bottom:1px solid #eee;
  display:flex;
  justify-content:space-between;
  gap:10px;
}
.cart-item small{color:#777}
.qty{margin-top:9px;display:flex;gap:12px;align-items:center}
.qty button{
  width:25px;height:25px;
  border:1px solid #ddd;background:white;cursor:pointer;
}
.total{
  display:flex;
  justify-content:space-between;
  font-weight:bold;
  font-size:19px;
  margin:25px 0;
}
.checkout{
  width:100%;
  padding:13px;
  background:#1769d2;
  color:white;
  border:0;
  cursor:pointer;
}
@media(max-width:900px){
  .products{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:650px){
  header{padding:0 4%}
  nav{display:none}
  .hero{padding:45px 6%;min-height:230px}
  .hero h1{font-size:29px}
  .container{padding:30px 15px}
  .products{grid-template-columns:repeat(2,1fr);gap:12px}
  .product img{height:160px}
  .details{padding:11px}
  .details h3{font-size:14px}
  .search{width:100%}
}
</style>
</head>

<body>

<header>
  <div class="logo">SK <span>KGN</span> TEAM</div>

  <nav>
    <a href="index.html">Home</a>
    <a href="#products">Shop</a>
    <a href="about.html">About Us</a>
  </nav>

  <button class="cart" onclick="toggleCart()">
    🛒 Cart (<span id="count">0</span>)
  </button>
</header>

<section class="hero">
  <div class="hero-content">
    <h1>Official SK KGN TEAM Store</h1>
    <p>
      Explore our official collection of products.
      Represent the brand with pride.
    </p>
    <a href="#products">Explore Products</a>
  </div>
</section>

<main class="container" id="products">

  <div class="heading">
    <h2>Our Products</h2>
    <input id="search" class="search"
      placeholder="Search products..."
      oninput="renderProducts()">
  </div>

  <div class="filters">
    <button class="active" onclick="setCategory('All',this)">All</button>
    <button onclick="setCategory('Books',this)">Books</button>
    <button onclick="setCategory('T-Shirts',this)">T-Shirts</button>
    <button onclick="setCategory('Caps',this)">Caps</button>
    <button onclick="setCategory('Hoodies',this)">Hoodies</button>
    <button onclick="setCategory('Accessories',this)">Accessories</button>
  </div>

  <div class="products" id="productGrid">
    <div class="empty">
      <h3>Loading Products...</h3>
    </div>
  </div>

</main>

<footer>
  © <span id="year"></span> SK KGN TEAM. All Rights Reserved.
</footer>

<div class="overlay" id="overlay" onclick="toggleCart()">
  <div class="cart-panel" onclick="event.stopPropagation()">
    <div class="cart-title">
      <h2>Your Cart</h2>
      <button onclick="toggleCart()">×</button>
    </div>

    <div id="cartItems"></div>

    <div class="total">
      <span>Total</span>
      <span id="total">₹0</span>
    </div>

    <button class="checkout" onclick="checkout()">
      Proceed to Checkout
    </button>
  </div>
</div>

<script type="module">
import {initializeApp,getApps,getApp}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {getFirestore,collection,getDocs}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyAOdyFtVEoAeVd1T1WjaXrkPBPTz9oHKQ",
  authDomain:"sk-kgn-team.firebaseapp.com",
  databaseURL:"https://sk-kgn-team-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"sk-kgn-team",
  storageBucket:"sk-kgn-team.firebasestorage.app",
  messagingSenderId:"228612697498",
  appId:"1:228612697498:web:a304b57bf5a59d2933de23",
  measurementId:"G-BXWT6BPTB6"
};

const app=getApps().length?getApp():initializeApp(firebaseConfig);
const db=getFirestore(app);

let products=[];
let cart=[];
let category="All";

const grid=document.getElementById("productGrid");

function safe(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[c]));
}

function safeImage(value){
  try{
    const u=new URL(value,location.href);
    return ["https:","http:"].includes(u.protocol)?safe(u.href):"";
  }catch{return ""}
}

async function loadProducts(){
  try{
    const snap=await getDocs(collection(db,"storeProducts"));

    products=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(p=>p.active!==false && p.status!=="inactive" && p.status!=="draft");

    renderProducts();
  }catch(e){
    console.error(e);
    grid.innerHTML=`<div class="empty">
      <h3>Products could not be loaded</h3>
      <p>Please try again later.</p>
    </div>`;
  }
}

window.setCategory=(value,btn)=>{
  category=value;
  document.querySelectorAll(".filters button")
    .forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  renderProducts();
};

window.renderProducts=()=>{
  const q=document.getElementById("search").value.toLowerCase();

  const list=products.filter(p=>
    (category==="All" || p.category===category) &&
    String(p.name||p.title||"").toLowerCase().includes(q)
  );

  if(!list.length){
    grid.innerHTML=`<div class="empty">
      <h3>${products.length?"No Products Found":"Coming Soon"}</h3>
      <p>${products.length
        ?"Try another search or category."
        :"Our official products will be available here soon."}</p>
    </div>`;
    return;
  }

  grid.innerHTML=list.map(p=>{
    const stock=Number(p.stock??999);
    return `<article class="product">
      <img src="${safeImage(p.imageUrl||p.image||"")}"
           alt="${safe(p.name||p.title)}">
      <div class="details">
        <h3>${safe(p.name||p.title||"Product")}</h3>
        <p>${safe(p.description||"Official SK KGN TEAM product.")}</p>
        <div class="price">₹${Number(p.price||0).toLocaleString("en-IN")}</div>
        <button class="add" ${stock<=0?"disabled":""}
          onclick="addToCart('${safe(p.id)}')">
          ${stock<=0?"Out of Stock":"Add to Cart"}
        </button>
      </div>
    </article>`;
  }).join("");
};

window.addToCart=id=>{
  const p=products.find(x=>x.id===id);
  if(!p)return;

  const stock=Number(p.stock??999);
  const item=cart.find(x=>x.id===id);

  if(item){
    if(item.qty>=stock){alert("Stock limit reached.");return;}
    item.qty++;
  }else{
    if(stock<=0)return;
    cart.push({
      id,
      name:p.name||p.title||"Product",
      price:Number(p.price||0),
      qty:1,
      stock
    });
  }
  updateCart();
};

function updateCart(){
  document.getElementById("count").textContent=
    cart.reduce((s,x)=>s+x.qty,0);

  document.getElementById("total").textContent=
    "₹"+cart.reduce((s,x)=>s+x.price*x.qty,0).toLocaleString("en-IN");

  document.getElementById("cartItems").innerHTML=cart.length?
    cart.map(x=>`<div class="cart-item">
      <div>
        <strong>${safe(x.name)}</strong><br>
        <small>₹${x.price} each</small>
        <div class="qty">
          <button onclick="changeQty('${x.id}',-1)">−</button>
          ${x.qty}
          <button onclick="changeQty('${x.id}',1)">+</button>
        </div>
      </div>
      <strong>₹${x.price*x.qty}</strong>
    </div>`).join(""):"Your cart is empty.";
}

window.changeQty=(id,n)=>{
  const x=cart.find(i=>i.id===id);
  if(!x)return;
  x.qty+=n;
  if(x.qty<=0)cart=cart.filter(i=>i.id!==id);
  else if(x.qty>x.stock){x.qty=x.stock;alert("Stock limit reached.");}
  updateCart();
};

window.toggleCart=()=>{
  document.getElementById("overlay").classList.toggle("show");
};

window.checkout=()=>{
  if(!cart.length){alert("Your cart is empty.");return;}
  alert("Secure Razorpay checkout will be connected after backend verification.");
};

document.getElementById("year").textContent=new Date().getFullYear();
loadProducts();
</script>

</body>
</html>
