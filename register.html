<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#142b4b">
<title>Create Account | SK KGN TEAM</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f5f8;
  color:#172033;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:440px;
  background:#fff;
  padding:30px;
  border-radius:15px;
  border:1px solid #e2e7ee;
  box-shadow:0 12px 35px rgba(0,0,0,.07);
}

.brand{font-size:23px;font-weight:800;color:#17365f}
.subtitle{color:#687386;font-size:14px;margin-top:7px}
h1{font-size:25px;margin-top:27px;margin-bottom:8px}
.description{color:#687386;font-size:14px;line-height:1.5;margin-bottom:20px}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin:15px 0 7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ccd4df;
  border-radius:8px;
  font-size:15px;
}

input:focus{outline:1px solid #17365f}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:8px;
  background:#17365f;
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.google{
  background:#fff;
  color:#26364d;
  border:1px solid #ccd4df;
}

button:disabled{opacity:.6;cursor:not-allowed}

.message{
  font-size:13px;
  line-height:1.5;
  margin-top:13px;
  color:#b42318;
}

.links{
  text-align:center;
  font-size:14px;
  margin-top:22px;
  line-height:2;
}

a{
  color:#174b83;
  text-decoration:none;
  font-weight:700;
}
</style>
</head>

<body>

<div class="card">

  <div class="brand">SK KGN TEAM</div>
  <div class="subtitle">Private Complaint Consultancy</div>

  <h1>Create Account</h1>

  <p class="description">
    Register to access your SK KGN TEAM account.
    You can complete your profile later.
  </p>

  <form id="registerForm">

    <label for="name">Full Name</label>
    <input
      type="text"
      id="name"
      maxlength="100"
      autocomplete="name"
      required
    >

    <label for="email">Email Address</label>
    <input
      type="email"
      id="email"
      autocomplete="email"
      required
    >

    <label for="password">Create Password</label>
    <input
      type="password"
      id="password"
      minlength="6"
      autocomplete="new-password"
      required
    >

    <button type="submit" id="registerBtn">
      Create Account
    </button>

  </form>

  <button class="google" type="button" id="googleBtn">
    Continue with Google
  </button>

  <div class="message" id="message" role="alert"></div>

  <div class="links">
    Already have an account?
    <a href="login.html">Login</a>
    <br>
    <a href="index.html">← Back to Website</a>
  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithPopup,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore,
  doc,
  setDoc,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyAOdyFtVEoAeVdT1nWjaXRkPBPTZ9oHKQ",
  authDomain: "sk-kgn-team.firebaseapp.com",
  databaseURL: "https://sk-kgn-team-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sk-kgn-team",
  storageBucket: "sk-kgn-team.firebasestorage.app",
  messagingSenderId: "228612697498",
  appId: "1:228612697498:web:a304b57bf5a59d2933de23",
  measurementId: "G-BXWT6BPTB6"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const message = document.getElementById("message");
const registerBtn = document.getElementById("registerBtn");


async function saveUserProfile(user, fullName){

  await setDoc(doc(db,"users",user.uid),{

    uid:user.uid,
    name:fullName || user.displayName || "",
    email:user.email || "",
    mobile:"",
    city:"",
    state:"",
    createdAt:serverTimestamp(),
    updatedAt:serverTimestamp()

  },{merge:true});

}


// Email Registration
document.getElementById("registerForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  message.textContent="";
  registerBtn.disabled=true;
  registerBtn.textContent="Creating Account...";

  const fullName=document.getElementById("name").value.trim();
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  try{

    const result=await createUserWithEmailAndPassword(
      auth,email,password
    );

    await updateProfile(result.user,{
      displayName:fullName
    });

    await saveUserProfile(result.user,fullName);

    window.location.href="dashboard.html";

  }
  catch(error){

    console.error(error);

    if(error.code==="auth/email-already-in-use"){
      message.textContent="This email is already registered. Please login.";
    }
    else if(error.code==="auth/weak-password"){
      message.textContent="Password must contain at least 6 characters.";
    }
    else{
      message.textContent=error.message;
    }

    registerBtn.disabled=false;
    registerBtn.textContent="Create Account";

  }

});


// Google Registration
document.getElementById("googleBtn")
.addEventListener("click",async function(){

  message.textContent="";

  try{

    const provider=new GoogleAuthProvider();

    const result=await signInWithPopup(auth,provider);

    await saveUserProfile(
      result.user,
      result.user.displayName
    );

    window.location.href="dashboard.html";

  }
  catch(error){

    console.error(error);
    message.textContent=error.message;

  }

});

</script>

</body>
</html>
