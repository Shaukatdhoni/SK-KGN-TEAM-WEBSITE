/* =========================================================
   START PAYMENT
========================================================= */

async function startPayment(
  plan,
  amount
){

  if(
    !window.pendingComplaint
  ){

    alert(
      "Complaint details are missing. Please try again."
    );

    return;

  }


  const modal =
    document.getElementById(
      "skKgnPlanModal"
    );


  if(modal){

    modal
      .querySelectorAll(
        ".sk-plan-card"
      )
      .forEach(
        item => {

          item.disabled = true;

          item.style.opacity =
            ".55";

          item.style.pointerEvents =
            "none";

        }
      );

  }


  const loading =
    document.createElement("div");


  loading.id =
    "skKgnPaymentLoading";


  loading.style.cssText = `

    position:fixed;
    inset:0;

    z-index:300000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
      rgba(2,7,18,.88);

    backdrop-filter:blur(10px);

  `;


  loading.innerHTML = `

    <div style="

      width:100%;
      max-width:360px;

      padding:28px;

      border-radius:22px;

      text-align:center;

      background:#07152f;

      border:
        1px solid
        rgba(246,211,101,.30);

      box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);

      color:#fff;

    ">

      <div style="

        width:42px;
        height:42px;

        margin:
          0 auto 18px;

        border:
          4px solid
          rgba(246,211,101,.25);

        border-top-color:
          #f6d365;

        border-radius:50%;

        animation:
          skSpin 1s linear infinite;

      "></div>


      <h3 style="
        margin:0 0 8px;
      ">

        Preparing Secure Payment

      </h3>


      <p style="
        margin:0;
        color:#aeb7c7;
        font-size:13px;
        line-height:1.5;
      ">

        Please wait while we securely
        prepare your Razorpay payment.

      </p>

    </div>

  `;


  document.body.appendChild(
    loading
  );


  try{

    const response =
      await fetch(
        BACKEND_URL +
        "/api/create-payment-link",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              plan:
                plan,

              name:
                window.pendingComplaint.name,

              mobile:
                window.pendingComplaint.mobile,

              subject:
                window.pendingComplaint.subject,

              details:
                window.pendingComplaint.details

            })

        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok ||
      !data.shortUrl
    ){

      throw new Error(
        data.error ||
        "Unable to create payment link."
      );

    }


    /*
      Store ONLY the payment-link
      information needed to return
      to payment.

      Complaint itself is NOT saved
      to Firestore here.
    */

    sessionStorage.setItem(
      PENDING_PAYMENT_KEY,
      JSON.stringify({

        plan:
          plan,

        amount:
          amount,

        shortUrl:
          data.shortUrl,

        paymentLinkId:
          data.paymentLinkId,

        referenceId:
          data.referenceId

      })
    );


    /*
      Same tab.

      Razorpay callback will return
      to skkgnteam.in after payment.
    */

    window.location.href =
      data.shortUrl;


  }catch(error){

    console.error(
      "Payment Link Error:",
      error
    );


    loading.remove();


    if(modal){

      modal
        .querySelectorAll(
          ".sk-plan-card"
        )
        .forEach(
          item => {

            item.disabled =
              false;

            item.style.opacity =
              "1";

            item.style.pointerEvents =
              "auto";

          }
        );

    }


    alert(
      error.message ||
      "Unable to start payment. Please try again."
    );

  }

}

/* =========================================================
   PAYMENT VERIFICATION
========================================================= */

let verificationStarted =
  false;


async function handleVerifiedPayment(){

  if(verificationStarted)
    return;


  const params =
    new URLSearchParams(
      window.location.search
    );


  const payment =
    params.get("payment");


  const token =
    params.get("token");


  /* =======================================================
     SUCCESSFUL RAZORPAY CALLBACK
  ======================================================= */

  if(
    payment !== "verified" ||
    !token
  ){

    return;

  }


  verificationStarted =
    true;


  const loading =
    document.createElement("div");


  loading.id =
    "skKgnVerificationLoading";


  loading.style.cssText = `

    position:fixed;
    inset:0;

    z-index:500000;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
      rgba(2,7,18,.92);

    backdrop-filter:blur(12px);

  `;


  loading.innerHTML = `

    <div style="

      width:100%;
      max-width:380px;

      padding:30px;

      border-radius:24px;

      background:#07152f;

      border:
        1px solid
        rgba(246,211,101,.30);

      color:#fff;

      text-align:center;

      box-shadow:
        0 30px 80px
        rgba(0,0,0,.55);

    ">


      <div style="

        width:45px;
        height:45px;

        margin:
          0 auto 18px;

        border:
          4px solid
          rgba(246,211,101,.25);

        border-top-color:
          #f6d365;

        border-radius:50%;

        animation:
          skSpin 1s linear infinite;

      "></div>


      <h2 style="
        margin:0 0 9px;
        font-size:24px;
      ">

        Verifying Payment

      </h2>


      <p style="
        margin:0;
        color:#aeb7c7;
        font-size:14px;
        line-height:1.5;
      ">

        Please wait while your payment
        is securely verified.

      </p>

    </div>

  `;


  document.body.appendChild(
    loading
  );


  try{

    const response =
      await fetch(

        BACKEND_URL +
        "/api/verify-payment?token=" +
        encodeURIComponent(
          token
        )

      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok ||
      data.paymentStatus !==
        "Completed"
    ){

      throw new Error(
        data.error ||
        "Payment could not be verified."
      );

    }


    const complaint =
      data.complaint;


    if(
      !complaint ||
      !complaint.name ||
      !complaint.mobile ||
      !complaint.subject ||
      !complaint.details
    ){

      throw new Error(
        "Verified complaint data is incomplete."
      );

    }


    const paymentId =
      data.razorpayPaymentId;


    if(!paymentId){

      throw new Error(
        "Razorpay Payment ID is missing."
      );

    }


    /*
      Use payment ID as Firestore
      document ID.

      This prevents duplicate complaint
      creation if the callback is processed
      more than once.
    */

    const complaintRef =
      doc(
        db,
        "complaints",
        paymentId
      );


    const existing =
      await getDoc(
        complaintRef
      );


    let complaintId;


    if(existing.exists()){

      complaintId =
        existing.data()
          .complaintId;

    }else{

      complaintId =
        generateComplaintId();


      await setDoc(
        complaintRef,
        {

          complaintId:
            complaintId,

          name:
            complaint.name,

          mobile:
            complaint.mobile,

          subject:
            complaint.subject,

          details:
            complaint.details,

          plan:
            complaint.plan || "",

          status:
            "Submitted",

          paymentStatus:
            "Completed",

          razorpayPaymentId:
            paymentId,

          paymentLinkId:
            data.paymentLinkId,

          referenceId:
            data.referenceId,

          createdAt:
            serverTimestamp()

        }
      );

    }


    sessionStorage.removeItem(
      PENDING_PAYMENT_KEY
    );


    window.pendingComplaint =
      null;


    if(complaintForm){

      complaintForm.reset();

    }


    loading.remove();


    /*
      Remove token/payment from URL.
    */

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


    showSuccessPopup(
      complaintId
    );


  }catch(error){

    console.error(
      "Payment Verification Error:",
      error
    );


    loading.remove();


    showVerificationError(
      error.message
    );

  }

}

/* =========================================================

========================================================= */

window.searchComplaintStatus =
async function(){

  const input =
    document.getElementById(
      "statusComplaintId"
    );


  const result =
    document.getElementById(
      "statusResult"
    );


  const button =
    document.getElementById(
      "statusCheckButton"
    );


  const complaintId =
    input.value
      .trim()
      .toUpperCase();


  if(!complaintId){

    result.innerHTML = `

      <div style="

        padding:13px;

        border-radius:12px;

        background:#fef2f2;

        color:#b91c1c;

      ">

        Please enter your Complaint ID.

      </div>

    `;

    return;

  }


  button.disabled =
    true;


  button.textContent =
    "Checking...";


  result.innerHTML = `

    <div class="status-loading">

      <div class="status-spinner"></div>

      Checking your complaint...

    </div>

  `;


  try{

    const q =
      query(

        collection(
          db,
          "complaints"
        ),

        where(
          "complaintId",
          "==",
          complaintId
        )

      );


    const [
      snapshot
    ] =
      await Promise.all([

        getDocs(q),

        new Promise(
          resolve =>
            setTimeout(
              resolve,
              2500
            )
        )

      ]);


    if(snapshot.empty){

      result.innerHTML = `

        <div style="

          padding:15px;

          border-radius:14px;

          background:#fef2f2;

          color:#b91c1c;

        ">

          <strong>
            Complaint Not Found
          </strong>

          <br>

          Please check your Complaint ID
          and try again.

        </div>

      `;

      return;

    }


    const data =
      snapshot.docs[0].data();


    const status =
      data.status ||
      "Submitted";


    const normalized =
      status
        .toLowerCase()
        .trim();


    let statusColor =
      "#2563eb";


    let statusBackground =
      "#eff6ff";


    if(
      normalized.includes(
        "resolve"
      )
    ){

      statusColor =
        "#15803d";

      statusBackground =
        "#f0fdf4";

    }


    if(
      normalized.includes(
        "cancel"
      )
    ){

      statusColor =
        "#b91c1c";

      statusBackground =
        "#fef2f2";

    }


    if(
      normalized.includes(
        "review"
      )
    ){

      statusColor =
        "#b45309";

      statusBackground =
        "#fffbeb";

    }


    result.innerHTML = `

      <div style="

        border:
          1px solid #e4e7ec;

        border-radius:18px;

        overflow:hidden;

        box-shadow:
          0 10px 30px
          rgba(16,24,40,.07);

      ">


        <div style="

          padding:18px;

          background:
            ${statusBackground};

          color:
            ${statusColor};

        ">


          <small style="
            font-weight:800;
            opacity:.75;
          ">

            COMPLAINT ID

          </small>


          <div style="

            font-size:21px;

            font-weight:900;

          ">

            ${data.complaintId || complaintId}

          </div>


          <div style="

            display:inline-block;

            margin-top:9px;

            padding:7px 11px;

            border-radius:30px;

            background:white;

            font-weight:900;

          ">

            ● ${status}

          </div>


        </div>


        <div style="

          padding:18px;

          background:#fff;

        ">


          <div style="margin-bottom:13px;">

            <small style="

              color:#667085;

              font-weight:800;

            ">

              NAME

            </small>

            <br>

            ${data.name || "-"}

          </div>


          <div style="margin-bottom:13px;">

            <small style="

              color:#667085;

              font-weight:800;

            ">

              SUBJECT

            </small>

            <br>

            ${data.subject || "-"}

          </div>


          ${
            data.adminRemark ||
            data.adminNotes ||
            data.remark
            ?

            `

            <div style="

              margin-top:18px;

              padding:15px;

              border-radius:14px;

              background:#eef4ff;

              border:
                1px solid #bfdbfe;

            ">


              <strong style="
                color:#164a9c;
              ">

                Admin Remark

              </strong>


              <p style="

                margin-top:6px;

                color:#334155;

              ">

                ${
                  data.adminRemark ||
                  data.adminNotes ||
                  data.remark
                }

              </p>


            </div>

            `

            :

            ""
          }


        </div>


      </div>

    `;


  }catch(error){

    console.error(
      error
    );


    result.innerHTML = `

      <div style="

        padding:14px;

        border-radius:14px;

        background:#fef2f2;

        color:#b91c1c;

      ">

        Unable to check status.
        Please try again.

      </div>

    `;

  }finally{

    button.disabled =
      false;

    button.textContent =
      "Check Status →";

  }

};

/* =========================================================
   PAYMENT STATE START
========================================================= */

async function checkPaymentState(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const payment =
    params.get(
      "payment"
    );


  const token =
    params.get(
      "token"
    );


  /*
    SUCCESS CALLBACK
  */

  if(
    payment === "verified" &&
    token
  ){

    await handleVerifiedPayment();

    return;

  }


  /*
    FAILED/CANCELLED CALLBACK
    OR browser BACK from Razorpay
  */

  if(
    payment === "failed"
  ){

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

    showPaymentPendingPopup();

    return;

  }


  /*
    If user presses BACK from
    Razorpay payment page, sessionStorage
    remains and this popup appears.
  */

  const pending =
    sessionStorage.getItem(
      PENDING_PAYMENT_KEY
    );


  if(pending){

    showPaymentPendingPopup();

  }

}


/* =========================================================
   PAGE SHOW
========================================================= */

window.addEventListener(
  "pageshow",
  function(){

    checkPaymentState();

  }
);


/*
  Also run once normally.
*/

checkPaymentState();


</script>
