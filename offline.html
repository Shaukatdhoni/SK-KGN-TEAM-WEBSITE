<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You Are Offline | SK KGN TEAM</title>
<link rel="icon" href="Logo.jpg">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,sans-serif;
    background:#fff;
    color:#102445;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}
.container{max-width:480px;width:100%}
.logo{width:105px;height:105px;object-fit:contain;margin-bottom:22px}
.brand{font-size:22px;font-weight:800;margin-bottom:35px}
.brand span{color:#0068B1}
.icon{
    width:75px;height:75px;
    border:3px solid #0068B1;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 22px;
    font-size:30px;font-weight:700;color:#0068B1;
}
h1{font-size:26px;margin-bottom:13px}
p{font-size:14px;color:#657386;line-height:1.8;margin-bottom:25px}
button{
    border:0;background:#0068B1;color:white;
    padding:14px 25px;border-radius:5px;
    font-size:14px;font-weight:700;cursor:pointer;
}
button:hover{background:#102445}
small{display:block;margin-top:30px;color:#8290a0;font-size:12px}
</style>
</head>
<body>
<div class="container">
    <img src="Logo.jpg" class="logo" alt="SK KGN TEAM Logo">
    <div class="brand">SK <span>KGN TEAM</span></div>
    <div class="icon">!</div>
    <h1>You Are Offline</h1>
    <p>
        Your internet connection is unavailable.
        Please check your connection and try again.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
    <small>© SK KGN TEAM. All Rights Reserved.</small>
</div>
</body>
</html>
