<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Advocate Registration | SK KGN TEAM</title>
<meta name="description" content="Register as an advocate with SK KGN TEAM Advocate Network.">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f4f6fa;
    color: #172033;
}

header {
    background: #101d35;
    color: white;
    padding: 15px 5%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand img {
    width: 43px;
    height: 43px;
    object-fit: contain;
    border-radius: 6px;
}

.brand h2 {
    font-size: 17px;
}

.brand small {
    display: block;
    font-size: 11px;
    color: #b9c8df;
    margin-top: 3px;
}

header a {
    color: white;
    text-decoration: none;
    font-size: 13px;
    border: 1px solid #64748b;
    padding: 9px 13px;
    border-radius: 6px;
}

.container {
    max-width: 720px;
    margin: 30px auto;
    padding: 0 15px;
}

.intro {
    text-align: center;
    margin-bottom: 22px;
}

.intro h1 {
    font-size: 25px;
    color: #142849;
    margin-bottom: 8px;
}

.intro p {
    color: #64748b;
    font-size: 14px;
    line-height: 1.6;
}

.form-box {
    background: white;
    padding: 25px;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
    box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
}

.section-title {
    font-size: 17px;
    color: #142849;
    border-bottom: 1px solid #e5eaf1;
    padding-bottom: 11px;
    margin: 5px 0 18px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.field {
    margin-bottom: 15px;
}

.field.full {
    grid-column: 1 / -1;
}

label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 7px;
    color: #334155;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    outline: none;
    font-size: 14px;
    background: white;
    color: #172033;
}

input:focus, select:focus, textarea:focus {
    border-color: #2563eb;
}

textarea {
    min-height: 85px;
    resize: vertical;
}

.required {
    color: #dc2626;
}

.declaration {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    font-size: 13px;
    line-height: 1.6;
    color: #475569;
    margin: 18px 0;
}

.declaration input {
    width: 16px;
    height: 16px;
    margin-top: 3px;
}

button {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 7px;
    background: #173968;
    color: white;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

button:hover {
    background: #10294d;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#message {
    display: none;
    padding: 13px;
    border-radius: 7px;
    margin-bottom: 15px;
    font-size: 14px;
    line-height: 1.5;
}

footer {
    background: #101d35;
    color: #cbd5e1;
    text-align: center;
    padding: 22px 15px;
    margin-top: 40px;
    font-size: 12px;
}

footer img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    margin-bottom: 8px;
}

footer a {
    color: white;
    text-decoration: none;
    margin: 0 8px;
}

.footer-links {
    margin: 12px 0;
}

@media(max-width: 550px) {
    .form-grid {
        grid-template-columns: 1fr;
        gap: 0;
    }

    .field.full {
        grid-column: auto;
    }

    .form-box {
        padding: 18px;
    }

    .intro h1 {
        font-size: 22px;
    }

    header {
        padding: 12px 4%;
    }

    .brand h2 {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="Logo.jpg" alt="SK KGN TEAM Logo">
        <div>
            <h2>SK KGN TEAM</h2>
            <small>ADVOCATE NETWORK</small>
        </div>
    </div>

    <a href="index.html">Main Website</a>
</header>

<main class="container">

    <div class="intro">
        <h1>Advocate Registration</h1>
        <p>
            Join the SK KGN TEAM Advocate Network.
            Submit your professional details for review.
        </p>
    </div>

    <div class="form-box">

        <div id="message"></div>

        <form id="advocateForm">

            <h3 class="section-title">Personal Details</h3>

            <div class="form-grid">

                <div class="field full">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" id="name" required maxlength="100">
                </div>

                <div class="field">
                    <label>Mobile Number <span class="required">*</span></label>
                    <input type="tel" id="mobile" required
                    pattern="[0-9]{10}" maxlength="10"
                    placeholder="10-digit mobile number">
                </div>

                <div class="field">
                    <label>Email Address</label>
                    <input type="email" id="email">
                </div>

                <div class="field">
                    <label>State <span class="required">*</span></label>
                    <input type="text" id="state" required>
                </div>

                <div class="field">
                    <label>District <span class="required">*</span></label>
                    <input type="text" id="district" required>
                </div>

            </div>

            <h3 class="section-title">Professional Details</h3>

            <div class="form-grid">

                <div class="field">
                    <label>Bar Council <span class="required">*</span></label>
                    <input type="text" id="barCouncil" required
                    placeholder="e.g. Bar Council of Uttar Pradesh">
                </div>

                <div class="field">
                    <label>Enrolment Number <span class="required">*</span></label>
                    <input type="text" id="enrolmentNumber" required>
                </div>

                <div class="field">
                    <label>Enrolment Year</label>
                    <input type="number" id="enrolmentYear"
                    min="1950" max="2026" placeholder="e.g. 2020">
                </div>

                <div class="field">
                    <label>Experience <span class="required">*</span></label>
                    <select id="experience" required>
                        <option value="">Select Experience</option>
                        <option>Fresher</option>
                        <option>1-3 Years</option>
                        <option>3-5 Years</option>
                        <option>5-10 Years</option>
                        <option>10+ Years</option>
                    </select>
                </div>

                <div class="field full">
                    <label>Legal Practice Area <span class="required">*</span></label>
                    <select id="practiceArea" required>
                        <option value="">Select Practice Area</option>
                        <option>Civil Law</option>
                        <option>Criminal Law</option>
                        <option>Family Law</option>
                        <option>Property / Land Matters</option>
                        <option>Consumer Matters</option>
                        <option>Corporate Law</option>
                        <option>Labour Law</option>
                        <option>Constitutional Law</option>
                        <option>Other</option>
                    </select>
                </div>

            </div>

            <h3 class="section-title">Court Details</h3>

            <div class="form-grid">

                <div class="field full">
                    <label>Primary Court Name <span class="required">*</span></label>
                    <input type="text" id="courtName" required
                    placeholder="Enter court name">
                </div>

                <div class="field">
                    <label>Court Type</label>
                    <select id="courtType">
                        <option value="">Select Court Type</option>
                        <option>District Court</option>
                        <option>High Court</option>
                        <option>Supreme Court</option>
                        <option>Tribunal</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label>Languages</label>
                    <input type="text" id="languages"
                    placeholder="Hindi, English, etc.">
                </div>

            </div>

            <label class="declaration">
                <input type="checkbox" id="declaration" required>
                <span>
                    I confirm that the information provided is correct.
                    I understand that my application will be reviewed
                    before approval.
                </span>
            </label>

            <button type="submit" id="submitBtn">
                Submit Registration
            </button>

        </form>
    </div>

</main>

<footer>
    <img src="Logo.jpg" alt="SK KGN TEAM">
    <p><strong>SK KGN TEAM</strong></p>

    <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="advocates.html">Find an Advocate</a>
        <a href="legal.html">Legal</a>
    </div>

    <p>© 2026 SK KGN TEAM. All Rights Reserved.</p>
</footer>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyAOdyFtVEoAeVd1TnWjaXrkPBPTZ9oHKVQ",
    authDomain: "sk-kgn-team.firebaseapp.com",
    databaseURL: "https://sk-kgn-team-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "sk-kgn-team",
    storageBucket: "sk-kgn-team.firebasestorage.app",
    messagingSenderId: "228612697498",
    appId: "1:228612697498:web:a304b57bf5a59d2933de23",
    measurementId: "G-BXWT6BPTB6"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const form = document.getElementById("advocateForm");
const submitBtn = document.getElementById("submitBtn");
const message = document.getElementById("message");

function showMessage(text, success) {
    message.style.display = "block";
    message.style.background = success ? "#dcfce7" : "#fee2e2";
    message.style.color = success ? "#166534" : "#991b1b";
    message.textContent = text;
    message.scrollIntoView({ behavior: "smooth", block: "center" });
}

form.addEventListener("submit", async (e) => {
    e.preventDefault();

    if (!form.reportValidity()) return;

    submitBtn.disabled = true;
    submitBtn.textContent = "Submitting...";

    const name = document.getElementById("name").value.trim();
    const mobile = document.getElementById("mobile").value.trim();
    const email = document.getElementById("email").value.trim();
    const state = document.getElementById("state").value.trim();
    const district = document.getElementById("district").value.trim();
    const barCouncil = document.getElementById("barCouncil").value.trim();
    const enrolmentNumber = document.getElementById("enrolmentNumber").value.trim();
    const enrolmentYear = document.getElementById("enrolmentYear").value;
    const experience = document.getElementById("experience").value;
    const practiceArea = document.getElementById("practiceArea").value;
    const courtName = document.getElementById("courtName").value.trim();
    const courtType = document.getElementById("courtType").value;
    const languages = document.getElementById("languages").value.trim();

    try {

        await addDoc(collection(db, "advocateApplications"), {

            applicationId: "ADV-" + Date.now(),

            name,
            mobile,
            email,

            state,
            district,

            barCouncil,
            enrolmentNumber,
            enrolmentYear: enrolmentYear ? Number(enrolmentYear) : null,

            experience,
            practiceArea,
            practiceAreas: [practiceArea],

            courtName,
            courtType,
            languages,

            status: "Pending",
            publicConsent: true,
            declarationAccepted: true,

            submittedAt: serverTimestamp()

        });

        showMessage(
            "Your registration has been submitted successfully. Your application is pending review.",
            true
        );

        form.reset();

    } catch (error) {

        console.error("Registration error:", error);

        showMessage(
            "Registration could not be submitted. Please check your internet connection or try again later.",
            false
        );

    } finally {

        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Registration";

    }
});

</script>

</body>
</html>
